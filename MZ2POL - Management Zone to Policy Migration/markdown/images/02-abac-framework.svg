<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1496FF"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#73BE28"/></marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB800"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DE350B"/></marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  </defs>
  <rect width="930" height="500" fill="#0F172A"/>
  <text x="465" y="34" text-anchor="middle" fill="#F8FAFC" font-size="21" font-weight="700">The Permission Flow</text>
  <text x="465" y="56" text-anchor="middle" fill="#94A3B8" font-size="12.5">User → group → binding (policy + boundaries) → permission; segments filter inside what is permitted</text>
  <rect x="20" y="92" width="160" height="92" rx="7" fill="#1E293B" stroke="#64748B" stroke-width="1.2"/>
  <text x="30" y="111" text-anchor="start" fill="#CBD5E1" font-size="12" font-weight="700">User</text>
  <text x="30" y="128" text-anchor="start" fill="#94A3B8" font-size="10.5">SAML / SCIM</text>
  <text x="30" y="146" text-anchor="start" fill="#94A3B8" font-size="10.5">identity</text>
  <rect x="200" y="92" width="160" height="92" rx="7" fill="#1E293B" stroke="#1496FF" stroke-width="1.2"/>
  <text x="210" y="111" text-anchor="start" fill="#BFDBFE" font-size="12" font-weight="700">Group</text>
  <text x="210" y="128" text-anchor="start" fill="#94A3B8" font-size="10.5">team × role</text>
  <text x="210" y="146" text-anchor="start" fill="#94A3B8" font-size="10.5">from the IdP</text>
  <rect x="380" y="92" width="160" height="92" rx="7" fill="#1E293B" stroke="#A78BFA" stroke-width="1.2"/>
  <text x="390" y="111" text-anchor="start" fill="#DDD6FE" font-size="12" font-weight="700">Binding</text>
  <text x="390" y="128" text-anchor="start" fill="#94A3B8" font-size="10.5">policy + 0..n</text>
  <text x="390" y="146" text-anchor="start" fill="#94A3B8" font-size="10.5">boundaries</text>
  <rect x="560" y="92" width="160" height="92" rx="7" fill="#1E293B" stroke="#73BE28" stroke-width="1.2"/>
  <text x="570" y="111" text-anchor="start" fill="#86EFAC" font-size="12" font-weight="700">Permission</text>
  <text x="570" y="128" text-anchor="start" fill="#94A3B8" font-size="10.5">Grail: bucket, table,</text>
  <text x="570" y="146" text-anchor="start" fill="#94A3B8" font-size="10.5">record, field</text>
  <line x1="180" y1="138" x2="198" y2="138" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr-grey)"/>
  <line x1="360" y1="138" x2="378" y2="138" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr-grey)"/>
  <line x1="540" y1="138" x2="558" y2="138" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr-grey)"/>
  <line x1="720" y1="138" x2="758" y2="138" stroke="#73BE28" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <rect x="760" y="92" width="150" height="92" rx="7" fill="#1E293B" stroke="#22D3EE" stroke-width="1.2"/>
  <text x="770" y="111" text-anchor="start" fill="#A5F3FC" font-size="12" font-weight="700">Query result</text>
  <text x="770" y="128" text-anchor="start" fill="#94A3B8" font-size="10.5">records the user</text>
  <text x="770" y="146" text-anchor="start" fill="#94A3B8" font-size="10.5">may read</text>
  <rect x="380" y="210" width="160" height="92" rx="7" fill="#1E293B" stroke="#FFB800" stroke-width="1.2"/>
  <text x="390" y="229" text-anchor="start" fill="#FCD34D" font-size="12" font-weight="700">Boundary</text>
  <text x="390" y="246" text-anchor="start" fill="#94A3B8" font-size="10.5">WHERE — e.g.</text>
  <text x="390" y="262" text-anchor="start" fill="#94A3B8" font-size="10.5">storage:dt.security_</text>
  <text x="390" y="278" text-anchor="start" fill="#94A3B8" font-size="10.5">context MATCH ("a")</text>
  <line x1="460" y1="184" x2="460" y2="210" stroke="#FFB800" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="560" y="210" width="160" height="92" rx="7" fill="#1E293B" stroke="#22D3EE" stroke-width="1.2"/>
  <text x="570" y="229" text-anchor="start" fill="#A5F3FC" font-size="12" font-weight="700">Segment</text>
  <text x="570" y="246" text-anchor="start" fill="#94A3B8" font-size="10.5">view filter;</text>
  <text x="570" y="264" text-anchor="start" fill="#94A3B8" font-size="10.5">never widens access</text>
  <line x1="720" y1="256" x2="800" y2="186" stroke="#22D3EE" stroke-width="1.6" marker-end="url(#arr-cyan)"/>
  <rect x="20" y="330" width="890" height="148" rx="7" fill="#1E293B" stroke="#64748B" stroke-width="1.2"/>
  <text x="36" y="354" text-anchor="start" fill="#CBD5E1" font-size="13" font-weight="700">What a policy statement looks like</text>
  <text x="36" y="380" text-anchor="start" fill="#94A3B8" font-size="11.5">ALLOW storage:buckets:read WHERE storage:table-name = "logs";       // bucket layer</text>
  <text x="36" y="402" text-anchor="start" fill="#94A3B8" font-size="11.5">ALLOW storage:logs:read WHERE storage:dt.security_context MATCH ("payments");   // table + record layer</text>
  <text x="36" y="424" text-anchor="start" fill="#94A3B8" font-size="11.5">ALLOW environment:roles:viewer WHERE environment:management-zone IN ("Payments");   // classic, transitional</text>
  <text x="36" y="446" text-anchor="start" fill="#94A3B8" font-size="11.5">Service prefixes are required: storage:logs:read, not logs:read. Implicit deny: anything not allowed is denied.</text>
</svg>
