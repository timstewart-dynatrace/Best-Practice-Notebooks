<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1496FF"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#73BE28"/></marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB800"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DE350B"/></marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  </defs>
  <rect width="930" height="500" fill="#0F172A"/>
  <text x="465" y="34" text-anchor="middle" fill="#F8FAFC" font-size="21" font-weight="700">How One Request Is Evaluated</text>
  <text x="465" y="56" text-anchor="middle" fill="#94A3B8" font-size="12.5">Read top to bottom: the union of every binding, each expanded per boundary, then DENY, then the data layers</text>
  <rect x="20" y="74" width="890" height="60" rx="7" fill="#1E293B" stroke="#1496FF" stroke-width="1.2"/>
  <text x="36" y="98" text-anchor="start" fill="#BFDBFE" font-size="13" font-weight="700">1 · Collect</text>
  <text x="36" y="118" text-anchor="start" fill="#94A3B8" font-size="11">Every policy binding of every group the user is in (account level + environment level)</text>
  <line x1="465" y1="134" x2="465" y2="141" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr-grey)"/>
  <rect x="20" y="142" width="890" height="60" rx="7" fill="#1E293B" stroke="#A78BFA" stroke-width="1.2"/>
  <text x="36" y="166" text-anchor="start" fill="#DDD6FE" font-size="13" font-weight="700">2 · Expand each binding</text>
  <text x="36" y="186" text-anchor="start" fill="#94A3B8" font-size="11">Split multi-permission statements; apply each boundary separately; a condition only applies to permissions of its own service</text>
  <line x1="465" y1="202" x2="465" y2="209" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr-grey)"/>
  <rect x="20" y="210" width="890" height="60" rx="7" fill="#1E293B" stroke="#A78BFA" stroke-width="1.2"/>
  <text x="36" y="234" text-anchor="start" fill="#DDD6FE" font-size="13" font-weight="700">3 · Repeated condition names multiply</text>
  <text x="36" y="254" text-anchor="start" fill="#94A3B8" font-size="11">Two lines storage:dt.security_context = a / = b  →  the statement is multiplied: one per value (OR)</text>
  <line x1="465" y1="270" x2="465" y2="277" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr-grey)"/>
  <rect x="20" y="278" width="890" height="60" rx="7" fill="#1E293B" stroke="#73BE28" stroke-width="1.2"/>
  <text x="36" y="302" text-anchor="start" fill="#86EFAC" font-size="13" font-weight="700">4 · Union of all ALLOWs</text>
  <text x="36" y="322" text-anchor="start" fill="#94A3B8" font-size="11">Access is granted if any expanded statement matches — one unconditional ALLOW makes every WHERE on that table irrelevant</text>
  <line x1="465" y1="338" x2="465" y2="345" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr-grey)"/>
  <rect x="20" y="346" width="890" height="60" rx="7" fill="#1E293B" stroke="#DE350B" stroke-width="1.2"/>
  <text x="36" y="370" text-anchor="start" fill="#FCA5A5" font-size="13" font-weight="700">5 · DENY overrides</text>
  <text x="36" y="390" text-anchor="start" fill="#94A3B8" font-size="11">A matching DENY always wins; boundaries do not apply to DENY; a record-level DENY removes the whole table</text>
  <line x1="465" y1="406" x2="465" y2="413" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr-grey)"/>
  <rect x="20" y="414" width="890" height="60" rx="7" fill="#1E293B" stroke="#FFB800" stroke-width="1.2"/>
  <text x="36" y="438" text-anchor="start" fill="#FCD34D" font-size="13" font-weight="700">6 · Data checks</text>
  <text x="36" y="458" text-anchor="start" fill="#94A3B8" font-size="11">Bucket and table permission both needed; record condition on the record's field; = / IN / startsWith never match arrays</text>
</svg>
