<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1496FF"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#73BE28"/></marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB800"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DE350B"/></marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  </defs>
  <rect width="930" height="500" fill="#0F172A"/>
  <text x="465" y="34" text-anchor="middle" fill="#F8FAFC" font-size="21" font-weight="700">Exclusions: Push the NOT Into Enrichment</text>
  <text x="465" y="56" text-anchor="middle" fill="#94A3B8" font-size="12.5">Segments cannot exclude. An enrichment rule can — so decide membership once, at ingest, as a positive value</text>
  <rect x="20" y="80" width="270" height="120" rx="7" fill="#1E293B" stroke="#FFB800" stroke-width="1.2"/>
  <text x="30" y="99" text-anchor="start" fill="#FCD34D" font-size="12" font-weight="700">MZ rule today</text>
  <text x="30" y="116" text-anchor="start" fill="#94A3B8" font-size="10.5">HOST_GROUP_NAME BEGINS_WITH "prod-"</text>
  <text x="30" y="133" text-anchor="start" fill="#94A3B8" font-size="10.5">AND HOST_NAME NOT_CONTAINS "legacy"</text>
  <text x="30" y="150" text-anchor="start" fill="#94A3B8" font-size="10.5"></text>
  <text x="30" y="167" text-anchor="start" fill="#94A3B8" font-size="10.5">"all production except legacy boxes"</text>
  <line x1="290" y1="140" x2="330" y2="140" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr-grey)"/>
  <rect x="332" y="80" width="270" height="120" rx="7" fill="#1E293B" stroke="#DE350B" stroke-width="1.2"/>
  <text x="342" y="99" text-anchor="start" fill="#FCA5A5" font-size="12" font-weight="700">Direct segment translation</text>
  <text x="342" y="116" text-anchor="start" fill="#94A3B8" font-size="10.5">dt.host_group.id = "prod-*"</text>
  <text x="342" y="133" text-anchor="start" fill="#94A3B8" font-size="10.5">… and no way to say "except"</text>
  <text x="342" y="150" text-anchor="start" fill="#94A3B8" font-size="10.5"></text>
  <text x="342" y="167" text-anchor="start" fill="#94A3B8" font-size="10.5">segment shows the legacy hosts too</text>
  <path d="M578,89 L592,103 M592,89 L578,103" stroke="#DE350B" stroke-width="2.4"/>
  <text x="465" y="236" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700">Instead: let the enrichment condition carry the NOT</text>
  <rect x="20" y="256" width="300" height="150" rx="7" fill="#1E293B" stroke="#73BE28" stroke-width="1.2"/>
  <text x="30" y="275" text-anchor="start" fill="#86EFAC" font-size="12" font-weight="700">Central ingest enrichment rule</text>
  <text x="30" y="292" text-anchor="start" fill="#94A3B8" font-size="10.5">condition:</text>
  <text x="30" y="309" text-anchor="start" fill="#94A3B8" font-size="10.5">  matchesPhrase(dt.host_group.id, "prod-")</text>
  <text x="30" y="326" text-anchor="start" fill="#94A3B8" font-size="10.5">  AND NOT matchesPhrase(host.name, "legacy")</text>
  <text x="30" y="343" text-anchor="start" fill="#94A3B8" font-size="10.5">enrichment:</text>
  <text x="30" y="360" text-anchor="start" fill="#94A3B8" font-size="10.5">  primary_tags.tier = core-prod</text>
  <line x1="320" y1="330" x2="360" y2="330" stroke="#73BE28" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <rect x="362" y="256" width="260" height="150" rx="7" fill="#1E293B" stroke="#73BE28" stroke-width="1.2"/>
  <text x="372" y="275" text-anchor="start" fill="#86EFAC" font-size="12" font-weight="700">Every matching record</text>
  <text x="372" y="292" text-anchor="start" fill="#94A3B8" font-size="10.5">primary_tags.tier = core-prod</text>
  <text x="372" y="309" text-anchor="start" fill="#94A3B8" font-size="10.5"></text>
  <text x="372" y="326" text-anchor="start" fill="#94A3B8" font-size="10.5">legacy hosts simply never</text>
  <text x="372" y="343" text-anchor="start" fill="#94A3B8" font-size="10.5">receive the value</text>
  <line x1="622" y1="330" x2="662" y2="330" stroke="#73BE28" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <rect x="664" y="256" width="246" height="150" rx="7" fill="#1E293B" stroke="#1496FF" stroke-width="1.2"/>
  <text x="674" y="275" text-anchor="start" fill="#BFDBFE" font-size="12" font-weight="700">Segment (positive only)</text>
  <text x="674" y="292" text-anchor="start" fill="#94A3B8" font-size="10.5">Data (all types):</text>
  <text x="674" y="309" text-anchor="start" fill="#94A3B8" font-size="10.5">primary_tags.tier = core-prod</text>
  <text x="674" y="326" text-anchor="start" fill="#94A3B8" font-size="10.5"></text>
  <text x="674" y="343" text-anchor="start" fill="#94A3B8" font-size="10.5">also reusable by workflows,</text>
  <text x="674" y="360" text-anchor="start" fill="#94A3B8" font-size="10.5">bucket rules, dashboards</text>
  <text x="20" y="440" text-anchor="start" fill="#94A3B8" font-size="11.5">Order matters: the rule applies going forward only, and "contains / begins with" in a central rule is</text>
  <text x="20" y="458" text-anchor="start" fill="#94A3B8" font-size="11.5">matchesPhrase — check the match semantics against your names before relying on it (see §4).</text>
</svg>
