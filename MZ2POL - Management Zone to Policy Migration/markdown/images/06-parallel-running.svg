<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1496FF"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#73BE28"/></marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB800"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DE350B"/></marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  </defs>
  <rect width="930" height="500" fill="#0F172A"/>
  <text x="465" y="34" text-anchor="middle" fill="#F8FAFC" font-size="21" font-weight="700">Running Both Models Side by Side</text>
  <text x="465" y="56" text-anchor="middle" fill="#94A3B8" font-size="12.5">Per team, four states — the zone line leaves the boundary only after verification, never before</text>
  <rect x="20" y="74" width="240" height="70" rx="7" fill="#1E293B" stroke="#64748B" stroke-width="1.2"/>
  <text x="34" y="102" text-anchor="start" fill="#CBD5E1" font-size="13" font-weight="700">0 · Today</text>
  <text x="34" y="124" text-anchor="start" fill="#94A3B8" font-size="10.5">zone-scoped roles</text>
  <rect x="270" y="74" width="640" height="70" rx="7" fill="#64748B" opacity="0.10"/>
  <rect x="270" y="74" width="640" height="70" rx="7" fill="none" stroke="#64748B" stroke-width="1.2"/>
  <text x="284" y="114" text-anchor="start" fill="#94A3B8" font-size="11.5">Check: zone-only boundary on a default policy already grants all Grail data</text>
  <line x1="140" y1="144" x2="140" y2="153" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr-grey)"/>
  <rect x="20" y="154" width="240" height="70" rx="7" fill="#1E293B" stroke="#1496FF" stroke-width="1.2"/>
  <text x="34" y="182" text-anchor="start" fill="#BFDBFE" font-size="13" font-weight="700">1 · Dual</text>
  <text x="34" y="204" text-anchor="start" fill="#94A3B8" font-size="10.5">one boundary: zone + Grail + settings lines</text>
  <rect x="270" y="154" width="640" height="70" rx="7" fill="#1496FF" opacity="0.10"/>
  <rect x="270" y="154" width="640" height="70" rx="7" fill="none" stroke="#1496FF" stroke-width="1.2"/>
  <text x="284" y="194" text-anchor="start" fill="#94A3B8" font-size="11.5">Classic scoped by zone; Grail by security context</text>
  <line x1="140" y1="224" x2="140" y2="233" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr-grey)"/>
  <rect x="20" y="234" width="240" height="70" rx="7" fill="#1E293B" stroke="#73BE28" stroke-width="1.2"/>
  <text x="34" y="262" text-anchor="start" fill="#86EFAC" font-size="13" font-weight="700">2 · Verified</text>
  <text x="34" y="284" text-anchor="start" fill="#94A3B8" font-size="10.5">same boundary</text>
  <rect x="270" y="234" width="640" height="70" rx="7" fill="#73BE28" opacity="0.10"/>
  <rect x="270" y="234" width="640" height="70" rx="7" fill="none" stroke="#73BE28" stroke-width="1.2"/>
  <text x="284" y="274" text-anchor="start" fill="#94A3B8" font-size="11.5">Effective permissions resolved; MZ2POL-12 §10 and MZ2POL-10 §9 checks clean</text>
  <line x1="140" y1="304" x2="140" y2="313" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr-grey)"/>
  <rect x="20" y="314" width="240" height="70" rx="7" fill="#1E293B" stroke="#22D3EE" stroke-width="1.2"/>
  <text x="34" y="342" text-anchor="start" fill="#A5F3FC" font-size="13" font-weight="700">3 · Retired</text>
  <text x="34" y="364" text-anchor="start" fill="#94A3B8" font-size="10.5">zone line removed</text>
  <rect x="270" y="314" width="640" height="70" rx="7" fill="#22D3EE" opacity="0.10"/>
  <rect x="270" y="314" width="640" height="70" rx="7" fill="none" stroke="#22D3EE" stroke-width="1.2"/>
  <text x="284" y="354" text-anchor="start" fill="#94A3B8" font-size="11.5">Classic pages no longer used by the team; Grail unchanged</text>
  <rect x="20" y="400" width="890" height="78" rx="7" fill="#1E293B" stroke="#FFB800" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="36" y="424" text-anchor="start" fill="#FCD34D" font-size="12.5" font-weight="700">No fixed duration</text>
  <text x="36" y="444" text-anchor="start" fill="#94A3B8" font-size="11">Exit each state on evidence, not on a calendar: tag coverage, effective permissions and alert parity (MZ2POL-09)</text>
  <text x="36" y="462" text-anchor="start" fill="#94A3B8" font-size="11">per team. Boundary edits apply immediately to every binding, so pilot each change on one group first.</text>
</svg>
