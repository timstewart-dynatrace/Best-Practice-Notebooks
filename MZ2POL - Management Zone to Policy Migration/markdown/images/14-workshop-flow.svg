<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1496FF"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#73BE28"/></marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB800"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DE350B"/></marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  </defs>
  <rect width="930" height="500" fill="#0F172A"/>
  <text x="465" y="34" text-anchor="middle" fill="#F8FAFC" font-size="21" font-weight="700">Zone Disposition Workshop: Sessions and Outputs</text>
  <text x="465" y="56" text-anchor="middle" fill="#94A3B8" font-size="12.5">Six working sessions; each one ends with a filled-in table the next session needs</text>
  <rect x="20" y="74" width="290" height="118" rx="7" fill="#1E293B" stroke="#64748B" stroke-width="1.2"/>
  <text x="34" y="102" text-anchor="start" fill="#CBD5E1" font-size="13.5" font-weight="700">1 · Triage</text>
  <text x="34" y="130" text-anchor="start" fill="#94A3B8" font-size="11.5">in:  zone export, usage</text>
  <text x="34" y="154" text-anchor="start" fill="#CBD5E1" font-size="11.5" font-weight="700">out: keep / delete per zone</text>
  <rect x="320" y="74" width="290" height="118" rx="7" fill="#1E293B" stroke="#1496FF" stroke-width="1.2"/>
  <text x="334" y="102" text-anchor="start" fill="#BFDBFE" font-size="13.5" font-weight="700">2 · Jobs</text>
  <text x="334" y="130" text-anchor="start" fill="#94A3B8" font-size="11.5">in:  kept zones</text>
  <text x="334" y="154" text-anchor="start" fill="#BFDBFE" font-size="11.5" font-weight="700">out: access / filter / alert per zone</text>
  <rect x="620" y="74" width="290" height="118" rx="7" fill="#1E293B" stroke="#73BE28" stroke-width="1.2"/>
  <text x="634" y="102" text-anchor="start" fill="#86EFAC" font-size="13.5" font-weight="700">3 · Dimensions + tags</text>
  <text x="634" y="130" text-anchor="start" fill="#94A3B8" font-size="11.5">in:  jobs, existing tags</text>
  <text x="634" y="154" text-anchor="start" fill="#86EFAC" font-size="11.5" font-weight="700">out: key list + allowed values</text>
  <rect x="20" y="214" width="290" height="118" rx="7" fill="#1E293B" stroke="#A78BFA" stroke-width="1.2"/>
  <text x="34" y="242" text-anchor="start" fill="#DDD6FE" font-size="13.5" font-weight="700">4 · Rule translation</text>
  <text x="34" y="270" text-anchor="start" fill="#94A3B8" font-size="11.5">in:  rules, key list</text>
  <text x="34" y="294" text-anchor="start" fill="#DDD6FE" font-size="11.5" font-weight="700">out: MZ2POL-11 worksheet rows</text>
  <rect x="320" y="214" width="290" height="118" rx="7" fill="#1E293B" stroke="#22D3EE" stroke-width="1.2"/>
  <text x="334" y="242" text-anchor="start" fill="#A5F3FC" font-size="13.5" font-weight="700">5 · Personas + boundaries</text>
  <text x="334" y="270" text-anchor="start" fill="#94A3B8" font-size="11.5">in:  IdP groups, jobs</text>
  <text x="334" y="294" text-anchor="start" fill="#A5F3FC" font-size="11.5" font-weight="700">out: group × policy × boundary</text>
  <rect x="620" y="214" width="290" height="118" rx="7" fill="#1E293B" stroke="#FFB800" stroke-width="1.2"/>
  <text x="634" y="242" text-anchor="start" fill="#FCD34D" font-size="13.5" font-weight="700">6 · Alerting + cutover</text>
  <text x="634" y="270" text-anchor="start" fill="#94A3B8" font-size="11.5">in:  alerting profiles</text>
  <text x="634" y="294" text-anchor="start" fill="#FCD34D" font-size="11.5" font-weight="700">out: routing table, batch plan</text>
  <line x1="310" y1="133" x2="319" y2="133" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr-grey)"/>
  <line x1="310" y1="273" x2="319" y2="273" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr-grey)"/>
  <line x1="610" y1="133" x2="619" y2="133" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr-grey)"/>
  <line x1="610" y1="273" x2="619" y2="273" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr-grey)"/>
  <path d="M 765 192 C 765 205, 165 200, 165 212" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr-grey)"/>
  <rect x="20" y="352" width="890" height="126" rx="7" fill="#DE350B" opacity="0.10"/>
  <rect x="20" y="352" width="890" height="126" rx="7" fill="none" stroke="#DE350B" stroke-width="1.2"/>
  <text x="36" y="376" text-anchor="start" fill="#FCA5A5" font-size="13" font-weight="700">Stop conditions — do not leave the room with these open</text>
  <text x="36" y="400" text-anchor="start" fill="#94A3B8" font-size="11.5">• A zone with no owner and no decision  • A dimension with no allowed-value list  • A key nobody sets at the source</text>
  <text x="36" y="424" text-anchor="start" fill="#94A3B8" font-size="11.5">• A boundary that does not cover every domain its policies grant  • A team in an unscoped data-policy group</text>
  <text x="36" y="448" text-anchor="start" fill="#94A3B8" font-size="11.5">• An alerting profile with no named replacement workflow  • A cutover batch without a rollback line</text>
</svg>
