<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1496FF"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#73BE28"/></marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB800"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DE350B"/></marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  </defs>
  <rect width="930" height="500" fill="#0F172A"/>
  <text x="465" y="34" text-anchor="middle" fill="#F8FAFC" font-size="21" font-weight="700">The Migration on One Page</text>
  <text x="465" y="56" text-anchor="middle" fill="#94A3B8" font-size="12.5">Tags at source feed three replacements; the zone leaves last</text>
  <rect x="20" y="74" width="210" height="120" rx="7" fill="#1E293B" stroke="#64748B" stroke-width="1.2"/>
  <text x="30" y="93" text-anchor="start" fill="#CBD5E1" font-size="12" font-weight="700">Assess</text>
  <text x="30" y="110" text-anchor="start" fill="#94A3B8" font-size="10.5">00 inventory</text>
  <text x="30" y="132" text-anchor="start" fill="#94A3B8" font-size="10.5">03 jobs + priority</text>
  <text x="30" y="154" text-anchor="start" fill="#94A3B8" font-size="10.5">14 workshop</text>
  <line x1="230" y1="134" x2="258" y2="134" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr-grey)"/>
  <rect x="260" y="74" width="210" height="120" rx="7" fill="#1E293B" stroke="#73BE28" stroke-width="1.2"/>
  <text x="270" y="93" text-anchor="start" fill="#86EFAC" font-size="12" font-weight="700">Tag + translate</text>
  <text x="270" y="110" text-anchor="start" fill="#94A3B8" font-size="10.5">10 tagging at source</text>
  <text x="270" y="132" text-anchor="start" fill="#94A3B8" font-size="10.5">11 rule translation</text>
  <text x="270" y="154" text-anchor="start" fill="#94A3B8" font-size="10.5">gate: readiness</text>
  <line x1="470" y1="110" x2="500" y2="86" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#arr-purple)"/>
  <line x1="470" y1="134" x2="500" y2="160" stroke="#22D3EE" stroke-width="1.6" marker-end="url(#arr-cyan)"/>
  <line x1="470" y1="160" x2="500" y2="234" stroke="#1496FF" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <rect x="502" y="66" width="408" height="56" rx="7" fill="#1E293B" stroke="#A78BFA" stroke-width="1.2"/>
  <text x="516" y="90" text-anchor="start" fill="#DDD6FE" font-size="12" font-weight="700">Access → 12 architecture · 04 syntax · 08 templates</text>
  <text x="516" y="110" text-anchor="start" fill="#94A3B8" font-size="10.5">one boundary per team, every domain; MATCH on arrays</text>
  <rect x="502" y="134" width="408" height="56" rx="7" fill="#1E293B" stroke="#22D3EE" stroke-width="1.2"/>
  <text x="516" y="158" text-anchor="start" fill="#A5F3FC" font-size="12" font-weight="700">Filtering → 05 segments</text>
  <text x="516" y="178" text-anchor="start" fill="#94A3B8" font-size="10.5">one segment per dimension; exclusions pushed into tags</text>
  <rect x="502" y="202" width="408" height="56" rx="7" fill="#1E293B" stroke="#1496FF" stroke-width="1.2"/>
  <text x="516" y="226" text-anchor="start" fill="#BFDBFE" font-size="12" font-weight="700">Alerting → 09 workflows</text>
  <text x="516" y="246" text-anchor="start" fill="#94A3B8" font-size="10.5">routing tags; visibility via dt.security_context</text>
  <rect x="20" y="214" width="450" height="76" rx="7" fill="#1E293B" stroke="#FFB800" stroke-width="1.2"/>
  <text x="30" y="233" text-anchor="start" fill="#FCD34D" font-size="12" font-weight="700">Run + cut over</text>
  <text x="30" y="250" text-anchor="start" fill="#94A3B8" font-size="10.5">06 phases and states · 07 validation · 95 LAB rehearsal</text>
  <rect x="20" y="310" width="890" height="70" rx="7" fill="#DE350B" opacity="0.10"/>
  <rect x="20" y="310" width="890" height="70" rx="7" fill="none" stroke="#DE350B" stroke-width="1.2"/>
  <text x="36" y="334" text-anchor="start" fill="#FCA5A5" font-size="12.5" font-weight="700">Three traps that widen access silently</text>
  <text x="36" y="356" text-anchor="start" fill="#94A3B8" font-size="11.5">zone-only boundary on a default policy · a second boundary on one binding · an unscoped data policy in another group</text>
  <rect x="20" y="394" width="890" height="84" rx="7" fill="#1E293B" stroke="#64748B" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="36" y="418" text-anchor="start" fill="#CBD5E1" font-size="12.5" font-weight="700">Not yet: Spaces (13) — upcoming, not documented as available</text>
  <text x="36" y="442" text-anchor="start" fill="#94A3B8" font-size="11.5">Build on dt.security_context, segments and workflows now; the no-regret steps prepare for Spaces either way.</text>
</svg>
