<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1496FF"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#73BE28"/></marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB800"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DE350B"/></marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  </defs>
  <rect width="930" height="500" fill="#0F172A"/>
  <text x="465" y="34" text-anchor="middle" fill="#F8FAFC" font-size="21" font-weight="700">What Carries Forward Into Latest Dynatrace</text>
  <text x="465" y="56" text-anchor="middle" fill="#94A3B8" font-size="12.5">The classic constructs an MZ estate is built on, and what each becomes</text>
  <rect x="20" y="72" width="230" height="34" rx="7" fill="#1E293B" stroke="#64748B" stroke-width="1.2"/>
  <text x="32" y="94" text-anchor="start" fill="#CBD5E1" font-size="12" font-weight="700">Classic construct</text>
  <rect x="258" y="72" width="250" height="34" rx="7" fill="#1E293B" stroke="#64748B" stroke-width="1.2"/>
  <text x="270" y="94" text-anchor="start" fill="#CBD5E1" font-size="12" font-weight="700">Status in Latest Dynatrace</text>
  <rect x="516" y="72" width="394" height="34" rx="7" fill="#1E293B" stroke="#64748B" stroke-width="1.2"/>
  <text x="528" y="94" text-anchor="start" fill="#CBD5E1" font-size="12" font-weight="700">What replaces it</text>
  <rect x="20" y="114" width="230" height="64" rx="7" fill="#1E293B" stroke="#1496FF" stroke-width="1.2"/>
  <text x="32" y="140" text-anchor="start" fill="#BFDBFE" font-size="12" font-weight="700">Auto-tagging rules</text>
  <text x="32" y="158" text-anchor="start" fill="#94A3B8" font-size="10.5">entity conditions → tags</text>
  <rect x="258" y="114" width="250" height="64" rx="7" fill="#DE350B" opacity="0.10"/>
  <rect x="258" y="114" width="250" height="64" rx="7" fill="none" stroke="#DE350B" stroke-width="1.2"/>
  <text x="270" y="140" text-anchor="start" fill="#FCA5A5" font-size="11.5" font-weight="700">No effect on Grail data</text>
  <text x="270" y="158" text-anchor="start" fill="#94A3B8" font-size="10.5">not used by any Latest app</text>
  <rect x="516" y="114" width="394" height="64" rx="7" fill="#1E293B" stroke="#73BE28" stroke-width="1.2"/>
  <text x="528" y="140" text-anchor="start" fill="#86EFAC" font-size="11.5" font-weight="700">Primary Grail tags set at source,</text>
  <text x="528" y="158" text-anchor="start" fill="#94A3B8" font-size="10.5">or a central ingest enrichment rule</text>
  <rect x="20" y="186" width="230" height="64" rx="7" fill="#1E293B" stroke="#1496FF" stroke-width="1.2"/>
  <text x="32" y="212" text-anchor="start" fill="#BFDBFE" font-size="12" font-weight="700">Management zones</text>
  <text x="32" y="230" text-anchor="start" fill="#94A3B8" font-size="10.5">rules + propagation flags</text>
  <rect x="258" y="186" width="250" height="64" rx="7" fill="#DE350B" opacity="0.10"/>
  <rect x="258" y="186" width="250" height="64" rx="7" fill="none" stroke="#DE350B" stroke-width="1.2"/>
  <text x="270" y="212" text-anchor="start" fill="#FCA5A5" font-size="11.5" font-weight="700">Not supported by any</text>
  <text x="270" y="230" text-anchor="start" fill="#94A3B8" font-size="10.5">platform feature or app</text>
  <rect x="516" y="186" width="394" height="64" rx="7" fill="#1E293B" stroke="#73BE28" stroke-width="1.2"/>
  <text x="528" y="212" text-anchor="start" fill="#86EFAC" font-size="11.5" font-weight="700">Segments (filter) · policies + boundaries</text>
  <text x="528" y="230" text-anchor="start" fill="#94A3B8" font-size="10.5">on dt.security_context (access) · workflows (alerting)</text>
  <rect x="20" y="258" width="230" height="64" rx="7" fill="#1E293B" stroke="#1496FF" stroke-width="1.2"/>
  <text x="32" y="284" text-anchor="start" fill="#BFDBFE" font-size="12" font-weight="700">Naming rules</text>
  <text x="32" y="302" text-anchor="start" fill="#94A3B8" font-size="10.5">builtin:naming.services</text>
  <rect x="258" y="258" width="250" height="64" rx="7" fill="#FFB800" opacity="0.10"/>
  <rect x="258" y="258" width="250" height="64" rx="7" fill="none" stroke="#FFB800" stroke-width="1.2"/>
  <text x="270" y="284" text-anchor="start" fill="#FCD34D" font-size="11.5" font-weight="700">Being retired</text>
  <text x="270" y="302" text-anchor="start" fill="#94A3B8" font-size="10.5">dashboards/SLOs keep working</text>
  <rect x="516" y="258" width="394" height="64" rx="7" fill="#1E293B" stroke="#73BE28" stroke-width="1.2"/>
  <text x="528" y="284" text-anchor="start" fill="#86EFAC" font-size="11.5" font-weight="700">Names and context carried in the</text>
  <text x="528" y="302" text-anchor="start" fill="#94A3B8" font-size="10.5">telemetry itself</text>
  <rect x="20" y="330" width="230" height="64" rx="7" fill="#1E293B" stroke="#1496FF" stroke-width="1.2"/>
  <text x="32" y="356" text-anchor="start" fill="#BFDBFE" font-size="12" font-weight="700">Host-group name parsing</text>
  <text x="32" y="374" text-anchor="start" fill="#94A3B8" font-size="10.5">auto-tag extracts env/app</text>
  <rect x="258" y="330" width="250" height="64" rx="7" fill="#FFB800" opacity="0.10"/>
  <rect x="258" y="330" width="250" height="64" rx="7" fill="none" stroke="#FFB800" stroke-width="1.2"/>
  <text x="270" y="356" text-anchor="start" fill="#FCD34D" font-size="11.5" font-weight="700">Brittle; still works on</text>
  <text x="270" y="374" text-anchor="start" fill="#94A3B8" font-size="10.5">classic pages only</text>
  <rect x="516" y="330" width="394" height="64" rx="7" fill="#1E293B" stroke="#73BE28" stroke-width="1.2"/>
  <text x="528" y="356" text-anchor="start" fill="#86EFAC" font-size="11.5" font-weight="700">dt.host_group.id is a built-in field;</text>
  <text x="528" y="374" text-anchor="start" fill="#94A3B8" font-size="10.5">a central rule's DPL extracts the parts</text>
  <rect x="20" y="402" width="230" height="64" rx="7" fill="#1E293B" stroke="#1496FF" stroke-width="1.2"/>
  <text x="32" y="428" text-anchor="start" fill="#BFDBFE" font-size="12" font-weight="700">Auto-tags that surface infra</text>
  <text x="32" y="446" text-anchor="start" fill="#94A3B8" font-size="10.5">env from namespace, account</text>
  <rect x="258" y="402" width="250" height="64" rx="7" fill="#73BE28" opacity="0.10"/>
  <rect x="258" y="402" width="250" height="64" rx="7" fill="none" stroke="#73BE28" stroke-width="1.2"/>
  <text x="270" y="428" text-anchor="start" fill="#86EFAC" font-size="11.5" font-weight="700">Redundant</text>
  <text x="270" y="446" text-anchor="start" fill="#94A3B8" font-size="10.5">built-in primary Grail fields</text>
  <rect x="516" y="402" width="394" height="64" rx="7" fill="#1E293B" stroke="#73BE28" stroke-width="1.2"/>
  <text x="528" y="428" text-anchor="start" fill="#86EFAC" font-size="11.5" font-weight="700">k8s.namespace.name, k8s.cluster.name,</text>
  <text x="528" y="446" text-anchor="start" fill="#94A3B8" font-size="10.5">aws.account.id, azure.subscription — no rule</text>
</svg>
