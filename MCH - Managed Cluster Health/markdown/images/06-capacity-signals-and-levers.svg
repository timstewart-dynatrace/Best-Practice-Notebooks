<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="930" height="500" fill="#0F172A"/>
  <text x="465" y="36" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">Capacity: What Tells You, and What You Can Do</text>
  <text x="465" y="58" text-anchor="middle" fill="#94A3B8" font-size="13">Half the capacity events can't email you — and every hardware change needs a configuration change too</text>
  <text x="200" y="92" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="700">Signals</text>
  <text x="405" y="92" text-anchor="middle" fill="#64748B" font-size="11" font-weight="700">EMAILED</text>
  <text x="710" y="92" text-anchor="middle" fill="#86EFAC" font-size="15" font-weight="700">Levers</text>

  <rect x="30" y="104" width="310" height="46" fill="#1E293B" stroke="#FFB800" rx="6"/>
  <text x="46" y="124" fill="#F8FAFC" font-size="12" font-weight="700">Adaptive load reduction activated</text>
  <text x="46" y="141" fill="#94A3B8" font-size="11">traces skipped at random</text>
  <text x="405" y="132" text-anchor="middle" fill="#FCD34D" font-size="11" font-weight="700">Configurable</text>
  <rect x="30" y="160" width="310" height="46" fill="#1E293B" stroke="#FFB800" rx="6"/>
  <text x="46" y="180" fill="#F8FAFC" font-size="12" font-weight="700">Cluster traffic control</text>
  <text x="46" y="197" fill="#94A3B8" font-size="11">monitoring off on new hosts</text>
  <text x="405" y="188" text-anchor="middle" fill="#FCA5A5" font-size="11" font-weight="700">No</text>
  <rect x="30" y="216" width="310" height="46" fill="#1E293B" stroke="#FFB800" rx="6"/>
  <text x="46" y="236" fill="#F8FAFC" font-size="12" font-weight="700">Cluster node undersized</text>
  <text x="46" y="253" fill="#94A3B8" font-size="11">node below requirements</text>
  <text x="405" y="244" text-anchor="middle" fill="#FCD34D" font-size="11" font-weight="700">Configurable</text>
  <rect x="30" y="272" width="310" height="46" fill="#1E293B" stroke="#FFB800" rx="6"/>
  <text x="46" y="292" fill="#F8FAFC" font-size="12" font-weight="700">Heap memory emergency / cleanup</text>
  <text x="46" y="309" fill="#94A3B8" font-size="11">Server memory pressure</text>
  <text x="405" y="300" text-anchor="middle" fill="#FCA5A5" font-size="11" font-weight="700">No</text>
  <rect x="30" y="328" width="310" height="46" fill="#1E293B" stroke="#FFB800" rx="6"/>
  <text x="46" y="348" fill="#F8FAFC" font-size="12" font-weight="700">Capacity indicator (dashboard)</text>
  <text x="46" y="365" fill="#94A3B8" font-size="11">Cluster health self-monitoring</text>
  <text x="405" y="356" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="700">— dashboard</text>
  <rect x="30" y="384" width="310" height="46" fill="#1E293B" stroke="#FFB800" rx="6"/>
  <text x="46" y="404" fill="#F8FAFC" font-size="12" font-weight="700">Throughput drop (dsfm:server.*)</text>
  <text x="46" y="421" fill="#94A3B8" font-size="11">calls, spans, actions, agents</text>
  <text x="405" y="412" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="700">— metric</text>
  <rect x="540" y="104" width="360" height="46" fill="#1E293B" stroke="#73BE28" rx="6"/>
  <text x="556" y="124" fill="#F8FAFC" font-size="12" font-weight="700">Scale out</text>
  <text x="556" y="141" fill="#94A3B8" font-size="11">add nodes, up to 30; same hardware</text>
  <rect x="540" y="160" width="360" height="46" fill="#1E293B" stroke="#73BE28" rx="6"/>
  <text x="556" y="180" fill="#F8FAFC" font-size="12" font-weight="700">Scale up</text>
  <text x="556" y="197" fill="#94A3B8" font-size="11">more CPU / RAM — keep nodes equal</text>
  <rect x="540" y="216" width="360" height="46" fill="#1E293B" stroke="#73BE28" rx="6"/>
  <text x="556" y="236" fill="#F8FAFC" font-size="12" font-weight="700">Grow storage</text>
  <text x="556" y="253" fill="#94A3B8" font-size="11">resizable volumes; separate mounts</text>
  <rect x="540" y="272" width="360" height="46" fill="#1E293B" stroke="#73BE28" rx="6"/>
  <text x="556" y="292" fill="#F8FAFC" font-size="12" font-weight="700">Update the ingest limit</text>
  <text x="556" y="309" fill="#94A3B8" font-size="11">after every hardware change</text>
  <rect x="540" y="328" width="360" height="46" fill="#1E293B" stroke="#73BE28" rx="6"/>
  <text x="556" y="348" fill="#F8FAFC" font-size="12" font-weight="700">Shape the load</text>
  <text x="556" y="365" fill="#94A3B8" font-size="11">quotas, overload prevention, capture control</text>
  <rect x="540" y="384" width="360" height="46" fill="#1E293B" stroke="#73BE28" rx="6"/>
  <text x="556" y="404" fill="#F8FAFC" font-size="12" font-weight="700">Reduce incoming traffic</text>
  <text x="556" y="421" fill="#94A3B8" font-size="11">OneAgent settings</text>
  <line x1="440" y1="270" x2="530" y2="270" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="40" y1="452" x2="890" y2="452" stroke="#334155" stroke-width="1"/>
  <text x="465" y="474" text-anchor="middle" fill="#FCD34D" font-size="12" font-weight="700">Headroom rule: plan processing capacity one-third higher than typical utilization</text>
  <text x="465" y="492" text-anchor="middle" fill="#64748B" font-size="10">Source: Hardware requirements; Adaptive traffic management; Cluster event notifications; Local self-monitoring; Self-monitoring metrics; Single-cluster HA (DT docs, read 09/29/2026)</text>
</svg>
