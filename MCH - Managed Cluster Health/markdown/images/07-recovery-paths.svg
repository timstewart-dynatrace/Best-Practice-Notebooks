<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="930" height="500" fill="#0F172A"/>
  <text x="465" y="36" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">Choosing a Recovery Path</text>
  <text x="465" y="58" text-anchor="middle" fill="#94A3B8" font-size="13">What was lost decides what happens on its own — and what you have to do</text>
  <text x="125" y="92" text-anchor="middle" fill="#64748B" font-size="11" font-weight="700">WHAT WAS LOST</text>
  <text x="445" y="92" text-anchor="middle" fill="#64748B" font-size="11" font-weight="700">WHAT HAPPENS</text>
  <text x="760" y="92" text-anchor="middle" fill="#64748B" font-size="11" font-weight="700">WHAT YOU DO</text>

  <rect x="30" y="102" width="190" height="74" fill="#1496FF" opacity="0.08" stroke="#1496FF" stroke-width="1.5" rx="8"/>
  <text x="125" y="134" text-anchor="middle" fill="#BFDBFE" font-size="14" font-weight="700">One node</text>
  <text x="125" y="154" text-anchor="middle" fill="#94A3B8" font-size="11">3+ node cluster</text>
  <line x1="222" y1="139" x2="262" y2="139" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="266" y="102" width="358" height="74" fill="#1E293B" stroke="#334155" rx="6"/>
  <text x="445" y="134" text-anchor="middle" fill="#F8FAFC" font-size="12">cluster keeps running on three copies;</text>
  <text x="445" y="152" text-anchor="middle" fill="#F8FAFC" font-size="12">that node's transaction share is gone</text>
  <line x1="626" y1="139" x2="646" y2="139" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="650" y="102" width="250" height="74" fill="#1E293B" stroke="#1496FF" rx="6"/>
  <text x="775" y="134" text-anchor="middle" fill="#F8FAFC" font-size="11">remove the node, install a replacement</text>
  <text x="775" y="152" text-anchor="middle" fill="#94A3B8" font-size="11">(MCH-02 §5, MCH-03 §7)</text>
  <rect x="30" y="190" width="190" height="74" fill="#DE350B" opacity="0.08" stroke="#DE350B" stroke-width="1.5" rx="8"/>
  <text x="125" y="222" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="700">The whole cluster</text>
  <text x="125" y="242" text-anchor="middle" fill="#94A3B8" font-size="11">no surviving nodes</text>
  <line x1="222" y1="227" x2="262" y2="227" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="266" y="190" width="358" height="74" fill="#1E293B" stroke="#334155" rx="6"/>
  <text x="445" y="222" text-anchor="middle" fill="#F8FAFC" font-size="12">restore from backup onto new hosts;</text>
  <text x="445" y="240" text-anchor="middle" fill="#F8FAFC" font-size="12">recent 1-/5-min metrics, traces not restored</text>
  <line x1="626" y1="227" x2="646" y2="227" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="650" y="190" width="250" height="74" fill="#1E293B" stroke="#DE350B" rx="6"/>
  <text x="775" y="222" text-anchor="middle" fill="#F8FAFC" font-size="11">same node count (≤ 2 fewer), same installer</text>
  <text x="775" y="240" text-anchor="middle" fill="#94A3B8" font-size="11">version; old cluster stopped</text>
  <rect x="30" y="278" width="190" height="74" fill="#FFB800" opacity="0.08" stroke="#FFB800" stroke-width="1.5" rx="8"/>
  <text x="125" y="310" text-anchor="middle" fill="#FCD34D" font-size="14" font-weight="700">One data center, < 72 h</text>
  <text x="125" y="330" text-anchor="middle" fill="#94A3B8" font-size="11">Premium HA</text>
  <line x1="222" y1="315" x2="262" y2="315" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="266" y="278" width="358" height="74" fill="#1E293B" stroke="#334155" rx="6"/>
  <text x="445" y="310" text-anchor="middle" fill="#F8FAFC" font-size="12">after 15 min the healthy DC takes over;</text>
  <text x="445" y="328" text-anchor="middle" fill="#F8FAFC" font-size="12">repaired automatically when it returns</text>
  <line x1="626" y1="315" x2="646" y2="315" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="650" y="278" width="250" height="74" fill="#1E293B" stroke="#FFB800" rx="6"/>
  <text x="775" y="310" text-anchor="middle" fill="#F8FAFC" font-size="11">stop the Server service in the affected DC;</text>
  <text x="775" y="328" text-anchor="middle" fill="#94A3B8" font-size="11">start it once the network is stable</text>
  <rect x="30" y="366" width="190" height="74" fill="#A78BFA" opacity="0.08" stroke="#A78BFA" stroke-width="1.5" rx="8"/>
  <text x="125" y="398" text-anchor="middle" fill="#DDD6FE" font-size="14" font-weight="700">One data center, > 72 h</text>
  <text x="125" y="418" text-anchor="middle" fill="#94A3B8" font-size="11">Premium HA</text>
  <line x1="222" y1="403" x2="262" y2="403" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="266" y="366" width="358" height="74" fill="#1E293B" stroke="#334155" rx="6"/>
  <text x="445" y="398" text-anchor="middle" fill="#F8FAFC" font-size="12">marked "not repaired after failover";</text>
  <text x="445" y="416" text-anchor="middle" fill="#F8FAFC" font-size="12">the cluster is not reliable</text>
  <line x1="626" y1="403" x2="646" y2="403" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="650" y="366" width="250" height="74" fill="#1E293B" stroke="#A78BFA" rx="6"/>
  <text x="775" y="398" text-anchor="middle" fill="#F8FAFC" font-size="11">rebuild the DC from the surviving one,</text>
  <text x="775" y="416" text-anchor="middle" fill="#94A3B8" font-size="11">or restore it from backup</text>
  <line x1="40" y1="462" x2="890" y2="462" stroke="#334155" stroke-width="1"/>
  <text x="465" y="484" text-anchor="middle" fill="#64748B" font-size="10">Source: Single-cluster HA; Backup and restore a cluster; Multi-data center failover; Recover from another data center (DT docs, read 10/01/2026)</text>
</svg>
