<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="930" height="500" fill="#0F172A"/>
  <text x="465" y="36" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">Starting and Stopping a 3+ Node Cluster</text>
  <text x="465" y="58" text-anchor="middle" fill="#94A3B8" font-size="13">Services depend on each other — each layer must be healthy on every node before the next one starts</text>
  <text x="20" y="92" fill="#86EFAC" font-size="15" font-weight="700">Start up</text>

  <rect x="20" y="104" width="160" height="96" fill="#64748B" opacity="0.08" stroke="#64748B" stroke-width="1.5" rx="8"/>
  <text x="100" y="128" text-anchor="middle" fill="#CBD5E1" font-size="14" font-weight="700">1. Firewall</text>
  <rect x="30" y="140" width="140" height="24" fill="#1E293B" stroke="#64748B" rx="6"/>
  <text x="100" y="156" text-anchor="middle" fill="#F8FAFC" font-size="11" font-family="ui-monospace, Menlo, monospace">firewall.sh start</text>
  <text x="100" y="186" text-anchor="middle" fill="#94A3B8" font-size="11">each node</text>
  <rect x="198" y="104" width="160" height="96" fill="#22D3EE" opacity="0.08" stroke="#22D3EE" stroke-width="1.5" rx="8"/>
  <text x="278" y="128" text-anchor="middle" fill="#A5F3FC" font-size="14" font-weight="700">2. Elasticsearch</text>
  <rect x="208" y="140" width="140" height="24" fill="#1E293B" stroke="#22D3EE" rx="6"/>
  <text x="278" y="156" text-anchor="middle" fill="#F8FAFC" font-size="10" font-family="ui-monospace, Menlo, monospace">elasticsearch.sh start</text>
  <text x="278" y="186" text-anchor="middle" fill="#94A3B8" font-size="11">all nodes together</text>
  <rect x="376" y="104" width="160" height="96" fill="#73BE28" opacity="0.08" stroke="#73BE28" stroke-width="1.5" rx="8"/>
  <text x="456" y="128" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="700">3. Cassandra</text>
  <rect x="386" y="140" width="140" height="24" fill="#1E293B" stroke="#73BE28" rx="6"/>
  <text x="456" y="156" text-anchor="middle" fill="#F8FAFC" font-size="11" font-family="ui-monospace, Menlo, monospace">cassandra.sh start</text>
  <text x="456" y="186" text-anchor="middle" fill="#94A3B8" font-size="11">all nodes together</text>
  <rect x="554" y="104" width="160" height="96" fill="#1496FF" opacity="0.08" stroke="#1496FF" stroke-width="1.5" rx="8"/>
  <text x="634" y="128" text-anchor="middle" fill="#BFDBFE" font-size="14" font-weight="700">4. Server</text>
  <rect x="564" y="140" width="140" height="24" fill="#1E293B" stroke="#1496FF" rx="6"/>
  <text x="634" y="156" text-anchor="middle" fill="#F8FAFC" font-size="11" font-family="ui-monospace, Menlo, monospace">server.sh start</text>
  <text x="634" y="186" text-anchor="middle" fill="#94A3B8" font-size="11">all nodes · up to ~10 min</text>
  <rect x="732" y="104" width="160" height="96" fill="#A78BFA" opacity="0.08" stroke="#A78BFA" stroke-width="1.5" rx="8"/>
  <text x="812" y="128" text-anchor="middle" fill="#DDD6FE" font-size="14" font-weight="700">5. Everything else</text>
  <rect x="742" y="140" width="140" height="24" fill="#1E293B" stroke="#A78BFA" rx="6"/>
  <text x="812" y="156" text-anchor="middle" fill="#F8FAFC" font-size="11" font-family="ui-monospace, Menlo, monospace">dynatrace.sh start</text>
  <text x="812" y="186" text-anchor="middle" fill="#94A3B8" font-size="11">each node</text>
  <line x1="182" y1="152" x2="196" y2="152" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="152" x2="374" y2="152" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="538" y1="152" x2="552" y2="152" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="716" y1="152" x2="730" y2="152" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="278" y1="202" x2="278" y2="214" stroke="#FFB800" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="198" y="216" width="160" height="78" fill="#1E293B" stroke="#FFB800" rx="6"/>
  <text x="278" y="236" text-anchor="middle" fill="#FCD34D" font-size="12" font-weight="700">Gate before step 3</text>
  <text x="278" y="254" text-anchor="middle" fill="#94A3B8" font-size="11">_cluster/health:</text>
  <text x="278" y="269" text-anchor="middle" fill="#94A3B8" font-size="11">active shards 100%,</text>
  <text x="278" y="284" text-anchor="middle" fill="#94A3B8" font-size="11">node count = cluster size</text>
  <line x1="456" y1="202" x2="456" y2="214" stroke="#FFB800" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="376" y="216" width="160" height="78" fill="#1E293B" stroke="#FFB800" rx="6"/>
  <text x="456" y="236" text-anchor="middle" fill="#FCD34D" font-size="12" font-weight="700">Gate before step 4</text>
  <text x="456" y="254" text-anchor="middle" fill="#94A3B8" font-size="11">cassandra-nodetool.sh</text>
  <text x="456" y="269" text-anchor="middle" fill="#94A3B8" font-size="11">status: every node UN</text>
  <rect x="554" y="216" width="338" height="78" fill="#1E293B" stroke="#334155" rx="6"/>
  <text x="723" y="238" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="700">Fewer than 3 nodes?</text>
  <text x="723" y="258" text-anchor="middle" fill="#94A3B8" font-size="11">dynatrace.sh start | stop | restart on each node</text>
  <text x="723" y="275" text-anchor="middle" fill="#94A3B8" font-size="11">runs every service "in the recommended order"</text>

  <text x="20" y="336" fill="#FCA5A5" font-size="15" font-weight="700">Shut down</text>
  <rect x="20" y="348" width="300" height="96" fill="#1496FF" opacity="0.08" stroke="#1496FF" stroke-width="1.5" rx="8"/>
  <text x="170" y="372" text-anchor="middle" fill="#BFDBFE" font-size="14" font-weight="700">1. Stop the Server</text>
  <rect x="34" y="384" width="272" height="24" fill="#1E293B" stroke="#1496FF" rx="6"/>
  <text x="170" y="400" text-anchor="middle" fill="#F8FAFC" font-size="11" font-family="ui-monospace, Menlo, monospace">server.sh stop</text>
  <text x="170" y="430" text-anchor="middle" fill="#94A3B8" font-size="11">on every node</text>
  <line x1="322" y1="396" x2="352" y2="396" stroke="#FFB800" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="356" y="348" width="210" height="96" fill="#1E293B" stroke="#FFB800" rx="6"/>
  <text x="461" y="372" text-anchor="middle" fill="#FCD34D" font-size="12" font-weight="700">Gate</text>
  <text x="461" y="394" text-anchor="middle" fill="#94A3B8" font-size="11">server.sh status shows every</text>
  <text x="461" y="410" text-anchor="middle" fill="#94A3B8" font-size="11">server process as not running</text>
  <line x1="568" y1="396" x2="588" y2="396" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="592" y="348" width="300" height="96" fill="#A78BFA" opacity="0.08" stroke="#A78BFA" stroke-width="1.5" rx="8"/>
  <text x="742" y="372" text-anchor="middle" fill="#DDD6FE" font-size="14" font-weight="700">2. Stop everything else</text>
  <rect x="606" y="384" width="272" height="24" fill="#1E293B" stroke="#A78BFA" rx="6"/>
  <text x="742" y="400" text-anchor="middle" fill="#F8FAFC" font-size="11" font-family="ui-monospace, Menlo, monospace">dynatrace.sh stop</text>
  <text x="742" y="430" text-anchor="middle" fill="#94A3B8" font-size="11">one node at a time</text>

  <line x1="40" y1="470" x2="890" y2="470" stroke="#334155" stroke-width="1"/>
  <text x="465" y="490" text-anchor="middle" fill="#64748B" font-size="10">Scripts live in /opt/dynatrace-managed/launcher/ (nodetool in /opt/dynatrace-managed/utils/). Source: Start/stop/restart a cluster and a node (DT docs, read 09/28/2026)</text>
</svg>
