<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" font-family="Inter, system-ui, sans-serif">
  <rect width="930" height="500" fill="#0F172A"/>
  <text x="465" y="36" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">What Lives in the Elasticsearch Store</text>
  <text x="465" y="58" text-anchor="middle" fill="#94A3B8" font-size="13">Two kinds of data share one store — and they differ in every way that matters for its health</text>

  <rect x="220" y="80" width="330" height="52" fill="#1496FF" opacity="0.08" stroke="#1496FF" stroke-width="1.5" rx="8"/>
  <text x="385" y="104" text-anchor="middle" fill="#BFDBFE" font-size="15" font-weight="700">RUM Classic user sessions</text>
  <text x="385" y="122" text-anchor="middle" fill="#94A3B8" font-size="11">can be up to 99% of the store in heavy-RUM clusters</text>
  <rect x="570" y="80" width="330" height="52" fill="#22D3EE" opacity="0.08" stroke="#22D3EE" stroke-width="1.5" rx="8"/>
  <text x="735" y="104" text-anchor="middle" fill="#A5F3FC" font-size="15" font-weight="700">Log Monitoring events</text>
  <text x="735" y="122" text-anchor="middle" fill="#94A3B8" font-size="11">needs 64 GB RAM on every node</text>

  <rect x="30" y="148" width="176" height="58" fill="#1E293B" stroke="#334155" rx="6"/>
  <text x="118" y="182" text-anchor="middle" fill="#F8FAFC" font-size="13" font-weight="700">Copies</text>
  <rect x="220" y="148" width="330" height="58" fill="#1E293B" stroke="#1496FF" rx="6"/>
  <text x="385" y="182" text-anchor="middle" fill="#F8FAFC" font-size="12">3 (replication factor three)</text>
  <rect x="570" y="148" width="330" height="58" fill="#1E293B" stroke="#22D3EE" rx="6"/>
  <text x="735" y="182" text-anchor="middle" fill="#F8FAFC" font-size="12">2 — losing two nodes makes some unavailable</text>
  <rect x="30" y="218" width="176" height="58" fill="#1E293B" stroke="#334155" rx="6"/>
  <text x="118" y="252" text-anchor="middle" fill="#F8FAFC" font-size="13" font-weight="700">Retention</text>
  <rect x="220" y="218" width="330" height="58" fill="#1E293B" stroke="#1496FF" rx="6"/>
  <text x="385" y="252" text-anchor="middle" fill="#F8FAFC" font-size="12">1–90 days per environment, default 35</text>
  <rect x="570" y="218" width="330" height="58" fill="#1E293B" stroke="#22D3EE" rx="6"/>
  <text x="735" y="252" text-anchor="middle" fill="#F8FAFC" font-size="12">up to 90 days; custom retention limited by capacity</text>
  <rect x="30" y="288" width="176" height="58" fill="#1E293B" stroke="#334155" rx="6"/>
  <text x="118" y="322" text-anchor="middle" fill="#F8FAFC" font-size="13" font-weight="700">Adaptive retention</text>
  <rect x="220" y="288" width="330" height="58" fill="#1E293B" stroke="#1496FF" rx="6"/>
  <text x="385" y="322" text-anchor="middle" fill="#F8FAFC" font-size="12">not covered</text>
  <rect x="570" y="288" width="330" height="58" fill="#1E293B" stroke="#22D3EE" rx="6"/>
  <text x="735" y="322" text-anchor="middle" fill="#F8FAFC" font-size="12">covered — trimmed when disk runs short</text>
  <rect x="30" y="358" width="176" height="58" fill="#1E293B" stroke="#334155" rx="6"/>
  <text x="118" y="392" text-anchor="middle" fill="#F8FAFC" font-size="13" font-weight="700">In the backup</text>
  <rect x="220" y="358" width="330" height="58" fill="#1E293B" stroke="#1496FF" rx="6"/>
  <text x="385" y="392" text-anchor="middle" fill="#F8FAFC" font-size="12">yes, unless you exclude them (GDPR option)</text>
  <rect x="570" y="358" width="330" height="58" fill="#1E293B" stroke="#22D3EE" rx="6"/>
  <text x="735" y="392" text-anchor="middle" fill="#F8FAFC" font-size="12">only if "Include backup of Log Monitoring events"</text>
  <line x1="40" y1="438" x2="890" y2="438" stroke="#334155" stroke-width="1"/>
  <text x="465" y="460" text-anchor="middle" fill="#FCD34D" font-size="12" font-weight="700">Unlike the Cassandra metrics store, retention here is a real size lever</text>
  <text x="465" y="484" text-anchor="middle" fill="#64748B" font-size="10">Source: Data retention periods; Single-cluster HA; Adaptive data retention; Backup and restore a cluster; Hardware requirements; Estimating backup size (DT docs, read 09/28/2026)</text>
</svg>
