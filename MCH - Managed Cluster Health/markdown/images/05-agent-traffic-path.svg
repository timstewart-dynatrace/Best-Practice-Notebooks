<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="930" height="500" fill="#0F172A"/>
  <text x="465" y="36" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">How Traffic Reaches a Managed Cluster — and Leaves It</text>
  <text x="465" y="58" text-anchor="middle" fill="#94A3B8" font-size="13">Monitoring data only flows up the ActiveGate hierarchy; the Mission Control link is always opened by the cluster</text>

  <!-- zone labels -->
  <text x="30" y="92" fill="#FCA5A5" font-size="13" font-weight="700">External / DMZ</text>
  <text x="30" y="282" fill="#BFDBFE" font-size="13" font-weight="700">Internal network</text>

  <!-- external sources -->
  <rect x="30" y="104" width="170" height="120" fill="#1E293B" stroke="#DE350B" rx="6"/>
  <text x="115" y="128" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="700">External sources</text>
  <text x="115" y="152" text-anchor="middle" fill="#94A3B8" font-size="11">OneAgents</text>
  <text x="115" y="170" text-anchor="middle" fill="#94A3B8" font-size="11">agentless and mobile RUM</text>
  <text x="115" y="188" text-anchor="middle" fill="#94A3B8" font-size="11">public synthetic</text>
  <line x1="202" y1="164" x2="250" y2="164" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="226" y="154" text-anchor="middle" fill="#64748B" font-size="9">HTTPS</text>

  <!-- cluster activegate -->
  <rect x="254" y="104" width="220" height="120" fill="#A78BFA" opacity="0.08" stroke="#A78BFA" stroke-width="1.5" rx="8"/>
  <text x="364" y="126" text-anchor="middle" fill="#DDD6FE" font-size="14" font-weight="700">Cluster ActiveGate</text>
  <text x="364" y="144" text-anchor="middle" fill="#94A3B8" font-size="10">level 2</text>
  <text x="364" y="164" text-anchor="middle" fill="#F8FAFC" font-size="11">public IP · own domain, not the web UI's</text>
  <text x="364" y="182" text-anchor="middle" fill="#F8FAFC" font-size="11">trusted certificate for RUM / mobile</text>
  <text x="364" y="200" text-anchor="middle" fill="#94A3B8" font-size="11">no web UI proxying</text>

  <!-- internal sources -->
  <rect x="30" y="294" width="170" height="80" fill="#1E293B" stroke="#1496FF" rx="6"/>
  <text x="115" y="320" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="700">Internal OneAgents</text>
  <text x="115" y="342" text-anchor="middle" fill="#94A3B8" font-size="11">use an Environment</text>
  <text x="115" y="358" text-anchor="middle" fill="#94A3B8" font-size="11">ActiveGate if present</text>
  <line x1="202" y1="334" x2="250" y2="334" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="226" y="324" text-anchor="middle" fill="#64748B" font-size="9">9999</text>

  <!-- environment activegate -->
  <rect x="254" y="294" width="220" height="80" fill="#22D3EE" opacity="0.08" stroke="#22D3EE" stroke-width="1.5" rx="8"/>
  <text x="364" y="318" text-anchor="middle" fill="#A5F3FC" font-size="14" font-weight="700">Environment ActiveGate</text>
  <text x="364" y="336" text-anchor="middle" fill="#94A3B8" font-size="10">level 1</text>
  <text x="364" y="358" text-anchor="middle" fill="#F8FAFC" font-size="11">receives on 9999</text>

  <!-- direct path -->
  <path d="M 115 376 L 115 420 L 500 420" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="300" y="412" text-anchor="middle" fill="#64748B" font-size="10">or directly to the cluster when no ActiveGate is reachable</text>

  <!-- arrows to cluster -->
  <line x1="476" y1="164" x2="500" y2="220" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="476" y1="334" x2="500" y2="300" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- cluster -->
  <rect x="504" y="200" width="200" height="236" fill="#1496FF" opacity="0.08" stroke="#1496FF" stroke-width="1.5" rx="8"/>
  <text x="604" y="224" text-anchor="middle" fill="#BFDBFE" font-size="14" font-weight="700">Managed Cluster</text>
  <text x="604" y="242" text-anchor="middle" fill="#94A3B8" font-size="11">internal only · port 443</text>
  <rect x="518" y="256" width="172" height="36" fill="#1E293B" stroke="#64748B" rx="6"/>
  <text x="604" y="279" text-anchor="middle" fill="#F8FAFC" font-size="11">NGINX on every node</text>
  <rect x="518" y="300" width="172" height="48" fill="#1E293B" stroke="#1496FF" rx="6"/>
  <text x="604" y="320" text-anchor="middle" fill="#F8FAFC" font-size="11">embedded ActiveGate</text>
  <text x="604" y="336" text-anchor="middle" fill="#94A3B8" font-size="10">level 3</text>
  <text x="604" y="372" text-anchor="middle" fill="#94A3B8" font-size="11">unhealthy nodes are</text>
  <text x="604" y="388" text-anchor="middle" fill="#94A3B8" font-size="11">skipped by NGINX</text>

  <!-- mission control -->
  <line x1="706" y1="300" x2="740" y2="300" stroke="#FFB800" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="744" y="200" width="160" height="236" fill="#FFB800" opacity="0.08" stroke="#FFB800" stroke-width="1.5" rx="8"/>
  <text x="824" y="224" text-anchor="middle" fill="#FCD34D" font-size="14" font-weight="700">Mission Control</text>
  <text x="824" y="250" text-anchor="middle" fill="#F8FAFC" font-size="11">outbound only</text>
  <text x="824" y="272" text-anchor="middle" fill="#94A3B8" font-size="11">HTTPS + WSS, 443</text>
  <text x="824" y="290" text-anchor="middle" fill="#94A3B8" font-size="11">TLS 1.2</text>
  <text x="824" y="316" text-anchor="middle" fill="#94A3B8" font-size="11">a proxy must support</text>
  <text x="824" y="332" text-anchor="middle" fill="#94A3B8" font-size="11">WebSockets and SNI</text>
  <text x="824" y="362" text-anchor="middle" fill="#F8FAFC" font-size="11">licensing · updates</text>
  <text x="824" y="378" text-anchor="middle" fill="#F8FAFC" font-size="11">health · remote access</text>

  <line x1="40" y1="460" x2="890" y2="460" stroke="#334155" stroke-width="1"/>
  <text x="465" y="480" text-anchor="middle" fill="#64748B" font-size="10">Source: Supported connectivity schemes for ActiveGates; Managed deployments; Set up load balancer; Cluster node ports (DT docs, read 09/29/2026)</text>
</svg>
