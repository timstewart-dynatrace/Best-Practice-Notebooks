<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="mpInputGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mpPipe1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mpPipe2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <filter id="mpShadow">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <marker id="mpArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="300" fill="#f8f9fa" rx="10"/>

  <!-- Title -->
  <text x="300" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Pipeline Group: Shared Base + Member Pipeline</text>

  <!-- Incoming Log -->
  <rect x="20" y="115" width="100" height="50" rx="6" fill="url(#mpInputGrad)" filter="url(#mpShadow)"/>
  <text x="70" y="137" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Incoming Log</text>
  <text x="70" y="152" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">payment request</text>

  <!-- Route arrow -->
  <line x1="120" y1="140" x2="150" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#mpArrow)"/>
  <text x="137" y="132" font-family="Arial, sans-serif" font-size="8" fill="#475569" text-anchor="middle">route</text>

  <!-- Group frame -->
  <rect x="155" y="45" width="250" height="215" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="280" y="62" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#334155" text-anchor="middle">PIPELINE GROUP (first matching route)</text>

  <!-- Base pipeline -->
  <rect x="170" y="72" width="220" height="30" rx="6" fill="url(#mpPipe1Grad)" filter="url(#mpShadow)"/>
  <text x="280" y="91" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Base pipeline (shared by every team)</text>
  <g transform="translate(170, 105)">
    <rect width="220" height="38" rx="4" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
    <text x="10" y="16" font-family="Arial, sans-serif" font-size="10" fill="#6d28d9">• Mask PII</text>
    <text x="10" y="31" font-family="Arial, sans-serif" font-size="10" fill="#6d28d9">• Set cost center</text>
  </g>

  <text x="280" y="160" font-family="Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">+ runs with</text>

  <!-- Member pipeline -->
  <rect x="170" y="168" width="220" height="30" rx="6" fill="url(#mpPipe2Grad)" filter="url(#mpShadow)"/>
  <text x="280" y="187" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Member pipeline (payments team)</text>
  <g transform="translate(170, 201)">
    <rect width="220" height="52" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
    <text x="10" y="16" font-family="Arial, sans-serif" font-size="10" fill="#1d4ed8">• Parse response_time</text>
    <text x="10" y="31" font-family="Arial, sans-serif" font-size="10" fill="#1d4ed8">• Metric extraction: request_duration</text>
    <text x="10" y="46" font-family="Arial, sans-serif" font-size="10" fill="#1d4ed8">• Bucket assignment: payment_logs</text>
  </g>

  <!-- Output arrows -->
  <line x1="405" y1="120" x2="440" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#mpArrow)"/>
  <line x1="405" y1="200" x2="440" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#mpArrow)"/>

  <!-- Metric Output -->
  <rect x="450" y="98" width="130" height="45" rx="6" fill="#10b981" filter="url(#mpShadow)"/>
  <text x="515" y="116" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">📊 METRIC</text>
  <text x="515" y="133" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.95)" text-anchor="middle">request_duration</text>

  <!-- Log Output -->
  <rect x="450" y="178" width="130" height="45" rx="6" fill="#3b82f6" filter="url(#mpShadow)"/>
  <text x="515" y="196" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">📋 LOG (stored once)</text>
  <text x="515" y="213" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.95)" text-anchor="middle">payment_logs</text>

  <!-- Footer -->
  <text x="300" y="282" font-family="Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">One route per record. A single pipeline can also extract a metric AND store the log — a group is for sharing processing across teams.</text>
</svg>
