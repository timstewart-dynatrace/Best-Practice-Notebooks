<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="classicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="modernGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <filter id="cvsShadow">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <marker id="cvsArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="#f8f9fa" rx="10"/>

  <!-- Title -->
  <text x="400" y="28" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Classic vs OpenPipeline Processing</text>

  <!-- Classic Section -->
  <rect x="30" y="55" width="740" height="95" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="30" y="55" width="740" height="28" rx="8" fill="url(#classicGrad)"/>
  <text x="400" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">CLASSIC PIPELINE (Rules at ingest, before storage)</text>

  <!-- Classic flow -->
  <rect x="60" y="100" width="100" height="35" rx="6" fill="#fef3c7" filter="url(#cvsShadow)"/>
  <text x="110" y="122" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">Ingest</text>

  <path d="M160,117 L200,117" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#cvsArrow)"/>

  <rect x="210" y="100" width="150" height="35" rx="6" fill="#fef3c7" filter="url(#cvsShadow)"/>
  <text x="285" y="116" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">Processing rules</text>
  <text x="285" y="129" font-family="Arial, sans-serif" font-size="8" fill="#92400e" text-anchor="middle">PARSE · mask · drop · log metrics</text>

  <path d="M360,117 L400,117" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#cvsArrow)"/>

  <rect x="410" y="100" width="100" height="35" rx="6" fill="#fef3c7" filter="url(#cvsShadow)"/>
  <text x="460" y="122" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">Store</text>

  <!-- Scope notes -->
  <text x="560" y="105" font-family="Arial, sans-serif" font-size="10" fill="#92400e">• Logs and business events only</text>
  <text x="560" y="120" font-family="Arial, sans-serif" font-size="10" fill="#92400e">• One ordered rule list, no routing</text>
  <text x="560" y="135" font-family="Arial, sans-serif" font-size="10" fill="#92400e">• Rule commands + DPL, not DQL</text>

  <!-- OpenPipeline Section -->
  <rect x="30" y="165" width="740" height="120" rx="8" fill="#fff" stroke="#22c55e" stroke-width="2"/>
  <rect x="30" y="165" width="740" height="28" rx="8" fill="url(#modernGrad)"/>
  <text x="400" y="185" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">OPENPIPELINE (Routed pipelines, before storage)</text>

  <!-- OpenPipeline flow -->
  <rect x="50" y="210" width="80" height="35" rx="6" fill="#d1fae5" filter="url(#cvsShadow)"/>
  <text x="90" y="232" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#047857" text-anchor="middle">Ingest</text>

  <path d="M130,227 L150,227" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#cvsArrow)"/>

  <rect x="160" y="210" width="80" height="35" rx="6" fill="#d1fae5" filter="url(#cvsShadow)"/>
  <text x="200" y="232" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#047857" text-anchor="middle">Route</text>

  <path d="M240,227 L260,227" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#cvsArrow)"/>

  <!-- Wider Process box covers mask/drop/transform/extract/cost/security/storage-assignment -->
  <rect x="270" y="210" width="180" height="35" rx="6" fill="#d1fae5" filter="url(#cvsShadow)"/>
  <text x="360" y="232" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#047857" text-anchor="middle">Process</text>

  <path d="M450,227 L480,227" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#cvsArrow)"/>

  <rect x="490" y="210" width="80" height="35" rx="6" fill="#d1fae5" filter="url(#cvsShadow)"/>
  <text x="530" y="232" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#047857" text-anchor="middle">Store</text>

  <!-- Benefit icons -->
  <text x="590" y="215" font-family="Arial, sans-serif" font-size="10" fill="#16a34a">✅ Logs, spans, events, metrics…</text>
  <text x="590" y="230" font-family="Arial, sans-serif" font-size="10" fill="#16a34a">✅ Routing to many pipelines</text>
  <text x="590" y="245" font-family="Arial, sans-serif" font-size="10" fill="#16a34a">✅ DQL processors</text>
  <text x="590" y="260" font-family="Arial, sans-serif" font-size="10" fill="#16a34a">✅ Extraction &amp; bucket stages</text>

  <!-- Sub-labels for Process (extraction now lives inside Process per docs) -->
  <text x="360" y="258" font-family="Arial, sans-serif" font-size="9" fill="#047857" text-anchor="middle">Mask · Drop · Transform · Parse</text>
  <text x="360" y="270" font-family="Arial, sans-serif" font-size="9" fill="#047857" text-anchor="middle">Extract · Smartscape · Cost · Security</text>
</svg>
