<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" font-family="Inter, system-ui, sans-serif">
  <rect width="930" height="500" fill="#0F172A"/>
  <text x="465" y="36" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">OpenShift SCC Admission for Dynatrace-Injected Pods (Operator 1.9.0+)</text>
  <text x="465" y="58" text-anchor="middle" fill="#94A3B8" font-size="13">The webhook mutates first; SCC admission validates the mutated pod — including the injected init container</text>

  <defs>
    <marker id="fl13" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Step 1: pod create + webhook -->
  <rect x="40" y="90" width="260" height="90" fill="#1E293B" stroke="#1496FF" stroke-width="1.5" rx="8"/>
  <text x="170" y="115" text-anchor="middle" fill="#BFDBFE" font-size="14" font-weight="700">1 · Pod created</text>
  <text x="170" y="136" text-anchor="middle" fill="#94A3B8" font-size="11">Dynatrace webhook injects init container</text>
  <text x="170" y="152" text-anchor="middle" fill="#94A3B8" font-size="11">+ seccompProfile: RuntimeDefault</text>
  <text x="170" y="168" text-anchor="middle" fill="#FCD34D" font-size="11" font-weight="600">(default since Operator 1.9.0)</text>

  <!-- Step 2: SCC admission -->
  <rect x="360" y="90" width="230" height="90" fill="#1E293B" stroke="#A78BFA" stroke-width="1.5" rx="8"/>
  <text x="475" y="115" text-anchor="middle" fill="#DDD6FE" font-size="14" font-weight="700">2 · SCC admission</text>
  <text x="475" y="136" text-anchor="middle" fill="#94A3B8" font-size="11">Whole pod spec validated against</text>
  <text x="475" y="152" text-anchor="middle" fill="#94A3B8" font-size="11">the admitting SCC (service-account</text>
  <text x="475" y="168" text-anchor="middle" fill="#94A3B8" font-size="11">perms; required-scc can pin)</text>

  <line x1="300" y1="135" x2="356" y2="135" stroke="#64748B" stroke-width="1.5" marker-end="url(#fl13)"/>

  <!-- Outcomes -->
  <line x1="475" y1="180" x2="170" y2="236" stroke="#64748B" stroke-width="1.5" marker-end="url(#fl13)"/>
  <line x1="475" y1="180" x2="475" y2="236" stroke="#64748B" stroke-width="1.5" marker-end="url(#fl13)"/>
  <line x1="475" y1="180" x2="780" y2="236" stroke="#64748B" stroke-width="1.5" marker-end="url(#fl13)"/>

  <rect x="40" y="240" width="260" height="110" fill="#73BE28" opacity="0.1" stroke="#73BE28" stroke-width="1.5" rx="8"/>
  <text x="170" y="265" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="700">restricted-v2 / nonroot-v2</text>
  <text x="170" y="286" text-anchor="middle" fill="#94A3B8" font-size="11">Both allow runtime/default seccomp</text>
  <text x="170" y="302" text-anchor="middle" fill="#94A3B8" font-size="11">(as does hostnetwork-v2) — non-root only</text>
  <text x="170" y="326" text-anchor="middle" fill="#86EFAC" font-size="12" font-weight="700">ADMITTED (non-root workloads)</text>

  <rect x="345" y="240" width="260" height="110" fill="#DE350B" opacity="0.1" stroke="#DE350B" stroke-width="2" rx="8"/>
  <text x="475" y="265" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="700">anyuid</text>
  <text x="475" y="286" text-anchor="middle" fill="#94A3B8" font-size="11">Root allowed — but the seccomp field</text>
  <text x="475" y="302" text-anchor="middle" fill="#94A3B8" font-size="11">is not permitted by this SCC</text>
  <text x="475" y="326" text-anchor="middle" fill="#FCA5A5" font-size="12" font-weight="700">Forbidden: seccomp may not be set</text>

  <rect x="650" y="240" width="260" height="110" fill="#73BE28" opacity="0.1" stroke="#73BE28" stroke-width="1.5" rx="8"/>
  <text x="780" y="265" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="700">Custom SCC (the fix)</text>
  <text x="780" y="286" text-anchor="middle" fill="#94A3B8" font-size="11">runAsUser: RunAsAny +</text>
  <text x="780" y="302" text-anchor="middle" fill="#94A3B8" font-size="11">seccompProfiles: [runtime/default]</text>
  <text x="780" y="326" text-anchor="middle" fill="#86EFAC" font-size="12" font-weight="700">ADMITTED (root workloads)</text>

  <!-- Bottom strips -->
  <rect x="40" y="380" width="425" height="82" fill="#FFB800" opacity="0.08" stroke="#FFB800" stroke-width="1.5" rx="8"/>
  <text x="252" y="406" text-anchor="middle" fill="#FCD34D" font-size="11" font-weight="700">Bridge: feature.dynatrace.com/init-container-seccomp-profile: "false"</text>
  <text x="252" y="426" text-anchor="middle" fill="#94A3B8" font-size="11">Restores admission by rolling back the hardening — an exit-dated</text>
  <text x="252" y="442" text-anchor="middle" fill="#94A3B8" font-size="11">workaround, not the destination (flag lives in the experimental API)</text>

  <rect x="485" y="380" width="425" height="82" fill="#DE350B" opacity="0.06" stroke="#DE350B" stroke-width="1.5" rx="8"/>
  <text x="697" y="406" text-anchor="middle" fill="#FCA5A5" font-size="13" font-weight="700">Gotcha: custom SCCs get NO auto-generated ClusterRole</text>
  <text x="697" y="426" text-anchor="middle" fill="#94A3B8" font-size="11">Built-ins ship system:openshift:scc:&lt;name&gt; roles (OCP 4.5+) — a custom</text>
  <text x="697" y="442" text-anchor="middle" fill="#94A3B8" font-size="11">SCC needs an explicit role with verb "use" + binding, or nothing can use it</text>
</svg>
