<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" font-family="Inter, system-ui, sans-serif">
  <rect width="930" height="500" fill="#0F172A"/>

  <text x="465" y="38" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">Manual Update Sequencing — ActiveGates Before OneAgents</text>
  <text x="465" y="62" text-anchor="middle" fill="#94A3B8" font-size="13">Auto-update on both tiers is recommended — this order applies when either is manual</text>

  <defs>
    <marker id="arrow-05a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Timeline bar -->
  <rect x="80" y="155" width="770" height="4" fill="#334155" rx="2"/>

  <!-- Stage 1: AG update -->
  <circle cx="170" cy="157" r="9" fill="#1496FF"/>
  <rect x="80" y="185" width="180" height="125" fill="#1496FF" opacity="0.08" stroke="#1496FF" stroke-width="1.5" rx="8"/>
  <text x="170" y="210" text-anchor="middle" fill="#BFDBFE" font-size="14" font-weight="700">1. ActiveGates</text>
  <text x="170" y="232" text-anchor="middle" fill="#94A3B8" font-size="11">Update first; roll one</text>
  <text x="170" y="249" text-anchor="middle" fill="#94A3B8" font-size="11">at a time in HA pairs</text>
  <text x="170" y="275" text-anchor="middle" fill="#94A3B8" font-size="11">Routing AGs in the</text>
  <text x="170" y="292" text-anchor="middle" fill="#94A3B8" font-size="11">OneAgent path</text>

  <!-- Arrow 1→2 -->
  <line x1="265" y1="248" x2="335" y2="248" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-05a)"/>

  <!-- Stage 2: Validate AG -->
  <circle cx="395" cy="157" r="9" fill="#FFB800"/>
  <rect x="305" y="185" width="180" height="125" fill="#FFB800" opacity="0.08" stroke="#FFB800" stroke-width="1.5" rx="8"/>
  <text x="395" y="210" text-anchor="middle" fill="#FCD34D" font-size="14" font-weight="700">2. Validate AGs</text>
  <text x="395" y="232" text-anchor="middle" fill="#94A3B8" font-size="11">Connectivity, routes,</text>
  <text x="395" y="249" text-anchor="middle" fill="#94A3B8" font-size="11">extension reload status</text>
  <text x="395" y="275" text-anchor="middle" fill="#94A3B8" font-size="11">Synthetic execution</text>
  <text x="395" y="292" text-anchor="middle" fill="#94A3B8" font-size="11">healthchecks pass</text>

  <!-- Arrow 2→3 -->
  <line x1="490" y1="248" x2="560" y2="248" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-05a)"/>

  <!-- Stage 3: OneAgent update -->
  <circle cx="620" cy="157" r="9" fill="#73BE28"/>
  <rect x="530" y="185" width="180" height="125" fill="#73BE28" opacity="0.08" stroke="#73BE28" stroke-width="1.5" rx="8"/>
  <text x="620" y="210" text-anchor="middle" fill="#86EFAC" font-size="14" font-weight="700">3. OneAgents</text>
  <text x="620" y="232" text-anchor="middle" fill="#94A3B8" font-size="11">Roll OneAgent updates</text>
  <text x="620" y="249" text-anchor="middle" fill="#94A3B8" font-size="11">across host groups</text>
  <text x="620" y="275" text-anchor="middle" fill="#94A3B8" font-size="11">Respect update windows</text>
  <text x="620" y="292" text-anchor="middle" fill="#94A3B8" font-size="11">(not maintenance windows)</text>

  <!-- Arrow 3→4 -->
  <line x1="715" y1="248" x2="785" y2="248" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-05a)"/>

  <!-- Stage 4: Validate OA -->
  <circle cx="840" cy="157" r="9" fill="#A78BFA"/>
  <rect x="755" y="185" width="170" height="125" fill="#A78BFA" opacity="0.08" stroke="#A78BFA" stroke-width="1.5" rx="8"/>
  <text x="840" y="210" text-anchor="middle" fill="#DDD6FE" font-size="14" font-weight="700">4. Validate OAs</text>
  <text x="840" y="232" text-anchor="middle" fill="#94A3B8" font-size="11">Deep monitoring</text>
  <text x="840" y="249" text-anchor="middle" fill="#94A3B8" font-size="11">re-injection complete</text>
  <text x="840" y="275" text-anchor="middle" fill="#94A3B8" font-size="11">Hosts reporting on</text>
  <text x="840" y="292" text-anchor="middle" fill="#94A3B8" font-size="11">new version</text>

  <!-- Why box -->
  <rect x="80" y="350" width="770" height="105" fill="#1E293B" stroke="#334155" stroke-width="1" rx="6"/>
  <text x="100" y="375" fill="#F8FAFC" font-size="13" font-weight="700">Why this order (when updating manually):</text>
  <text x="100" y="397" fill="#94A3B8" font-size="12">• OneAgents reach Dynatrace through the ActiveGates in their path. Dynatrace has set a minimum AG version for a</text>
  <text x="100" y="414" fill="#94A3B8" font-size="12">  OneAgent change (AG 1.154+ for 64-bit host IDs) — a floor for one feature, not an AG ≥ OneAgent rule.</text>
  <text x="100" y="431" fill="#94A3B8" font-size="12">• Synthetic AGs are not in the OneAgent path — their order does not matter; the browser has its own switch (§6).</text>
  <text x="100" y="448" fill="#94A3B8" font-size="12">• Validating AGs before touching OneAgents keeps one variable changing at a time.</text>
</svg>
