<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" font-family="Inter, system-ui, sans-serif">
  <rect width="930" height="500" fill="#0F172A"/>
  <text x="465" y="36" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">Classify the Query Before Migrating It</text>
  <text x="465" y="58" text-anchor="middle" fill="#94A3B8" font-size="13">Only one of these three shapes actually requires Smartscape</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="315" y="84" width="300" height="46" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5" rx="8"/>
  <text x="465" y="105" text-anchor="middle" fill="#F8FAFC" font-size="13" font-weight="700">What does the query return?</text>
  <text x="465" y="121" text-anchor="middle" fill="#94A3B8" font-size="11">Ask this before writing any DQL</text>

  <line x1="400" y1="130" x2="250" y2="168" stroke="#64748B" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="530" y1="130" x2="680" y2="168" stroke="#64748B" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="40" y="172" width="420" height="250" fill="#FFB800" opacity="0.08" stroke="#FFB800" stroke-width="1.5" rx="8"/>
  <text x="250" y="198" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="700">Mass data (logs · metrics · spans)</text>
  <text x="250" y="218" text-anchor="middle" fill="#94A3B8" font-size="11">Situations 1 and 2 — entity condition is a FILTER</text>

  <rect x="62" y="236" width="376" height="76" fill="#1E293B" stroke="#73BE28" stroke-width="1.5" rx="6"/>
  <text x="250" y="258" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700">1. Try a direct dimension filter</text>
  <text x="250" y="277" text-anchor="middle" fill="#94A3B8" font-size="11">filter: { dt.host_group.id == "prod-web" }</text>
  <text x="250" y="296" text-anchor="middle" fill="#94A3B8" font-size="11">No topology lookup · least data scanned</text>

  <rect x="62" y="324" width="376" height="80" fill="#1E293B" stroke="#1496FF" stroke-width="1.5" rx="6"/>
  <text x="250" y="346" text-anchor="middle" fill="#BFDBFE" font-size="13" font-weight="700">2. Fall back to a Smartscape subquery</text>
  <text x="250" y="365" text-anchor="middle" fill="#94A3B8" font-size="11">dt.smartscape.host in [ smartscapeNodes "HOST" ... ]</text>
  <text x="250" y="384" text-anchor="middle" fill="#94A3B8" font-size="11">Only when no dimension carries the condition</text>

  <rect x="480" y="172" width="410" height="250" fill="#1496FF" opacity="0.08" stroke="#1496FF" stroke-width="1.5" rx="8"/>
  <text x="685" y="198" text-anchor="middle" fill="#BFDBFE" font-size="15" font-weight="700">Entities themselves</text>
  <text x="685" y="218" text-anchor="middle" fill="#94A3B8" font-size="11">Situation 3 — the entity list IS the result</text>

  <rect x="502" y="236" width="366" height="76" fill="#1E293B" stroke="#1496FF" stroke-width="1.5" rx="6"/>
  <text x="685" y="258" text-anchor="middle" fill="#BFDBFE" font-size="13" font-weight="700">smartscapeNodes "HOST"</text>
  <text x="685" y="277" text-anchor="middle" fill="#94A3B8" font-size="11">The only valid path — no raw-dimension</text>
  <text x="685" y="296" text-anchor="middle" fill="#94A3B8" font-size="11">alternative exists for this shape</text>

  <rect x="502" y="324" width="366" height="80" fill="#1E293B" stroke="#A78BFA" stroke-width="1.5" rx="6"/>
  <text x="685" y="346" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700">Walking relationships? traverse</text>
  <text x="685" y="365" text-anchor="middle" fill="#94A3B8" font-size="11">edgeTypes: {runs_on}, targetTypes: {HOST}</text>
  <text x="685" y="384" text-anchor="middle" fill="#94A3B8" font-size="11">Node types UPPERCASE · edge types lowercase</text>

  <line x1="40" y1="446" x2="890" y2="446" stroke="#334155" stroke-width="1"/>
  <text x="40" y="470" fill="#94A3B8" font-size="11">Verify values, not row counts — the same entity set can come back with different name strings (classic names carry a [host-group] prefix).</text>
  <text x="40" y="488" fill="#94A3B8" font-size="11">dt.entity.* is deprecated. SaaS 1.334 (Mar 2026): classic queries fully supported for one more year.</text>
</svg>
