  <rect x="738" y="362" width="152" height="30" fill="#73BE28" fill-opacity="0.20" stroke="#73BE28" rx="2"/>
  <circle cx="814" cy="377" r="6" fill="#73BE28"/>

  <!-- Row 10: PHP -->
  <rect x="40" y="394" width="220" height="30" fill="#FFFFFF" stroke="#E5E5E5" rx="2"/>
