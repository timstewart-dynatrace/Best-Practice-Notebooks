  <rect x="738" y="234" width="152" height="30" fill="#73BE28" fill-opacity="0.20" stroke="#73BE28" rx="2"/>
  <circle cx="814" cy="249" r="6" fill="#73BE28"/>
  <text x="827" y="252" font-size="9" fill="#454646">otel4s / zio-tel</text>

