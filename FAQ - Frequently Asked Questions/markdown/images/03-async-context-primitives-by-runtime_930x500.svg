  <text x="50" y="323" font-size="9" fill="#6F7274">single-threaded event loop</text>
  <rect x="262" y="298" width="320" height="30" fill="#FFFFFF" stroke="#E5E5E5" rx="2"/>
  <text x="272" y="317" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1A1A1A">AsyncLocalStorage / async_hooks</text>
  <rect x="584" y="298" width="152" height="30" fill="#73BE28" fill-opacity="0.20" stroke="#73BE28" rx="2"/>
  <circle cx="660" cy="313" r="6" fill="#73BE28"/>
  <rect x="738" y="298" width="152" height="30" fill="#73BE28" fill-opacity="0.20" stroke="#73BE28" rx="2"/>
  <circle cx="814" cy="313" r="6" fill="#73BE28"/>

  <!-- Row 8: Python asyncio -->
  <rect x="40" y="330" width="220" height="30" fill="#FFFFFF" stroke="#E5E5E5" rx="2"/>
