  <rect x="738" y="426" width="152" height="30" fill="#73BE28" fill-opacity="0.20" stroke="#73BE28" rx="2"/>
  <circle cx="814" cy="441" r="6" fill="#73BE28"/>

  <text x="465" y="478" text-anchor="middle" font-size="10" font-style="italic" fill="#6F7274">Fragmenting cells (white, dashed) are where tracing breaks unless you switch to a runtime-aware OTel library.</text>
  <text x="465" y="492" text-anchor="middle" font-size="10" font-style="italic" fill="#6F7274">Scala effect systems are the canonical case: OneAgent fragments, otel4s / zio-telemetry propagate via IOLocal / FiberRef.</text>
</svg>
