<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" font-family="Helvetica, Arial, sans-serif">
  <rect width="930" height="500" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="465" y="22" text-anchor="middle" font-size="17" font-weight="700" fill="#1A1A1A">Async Context Propagation — Primitives by Runtime</text>
  <text x="465" y="40" text-anchor="middle" font-size="11" fill="#6F7274">Each runtime carries trace context in a different primitive — does each tool propagate it correctly?</text>

  <!-- Legend -->
  <circle cx="240" cy="60" r="6" fill="#73BE28"/>
  <text x="252" y="64" font-size="10" fill="#454646">Propagates correctly</text>
  <circle cx="370" cy="60" r="6" fill="#B4DC00"/>
  <text x="382" y="64" font-size="10" fill="#454646">Mixed / version-dependent</text>
  <circle cx="540" cy="60" r="6" fill="#FFFFFF" stroke="#6F7274" stroke-width="1.5"/>
  <text x="552" y="64" font-size="10" fill="#454646">Fragments / not applicable</text>

  <!-- Column header -->
  <rect x="40" y="74" width="220" height="28" fill="#454646" rx="3"/>
  <text x="150" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Runtime + async model</text>

  <rect x="262" y="74" width="320" height="28" fill="#454646" rx="3"/>
  <text x="422" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Context primitive</text>

  <rect x="584" y="74" width="152" height="28" fill="#1496FF" rx="3"/>
  <text x="660" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">OneAgent</text>

  <rect x="738" y="74" width="152" height="28" fill="#73BE28" rx="3"/>
  <text x="814" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">OTel (right library)</text>

  <!-- Row 1: Java classical -->
  <rect x="40" y="106" width="220" height="30" fill="#F5F5F5" stroke="#E5E5E5" rx="2"/>
  <text x="50" y="120" font-size="10" font-weight="700" fill="#1A1A1A">Java (classical)</text>
  <text x="50" y="131" font-size="9" fill="#6F7274">threads + executors + CompletableFuture</text>
  <rect x="262" y="106" width="320" height="30" fill="#FFFFFF" stroke="#E5E5E5" rx="2"/>
  <text x="272" y="125" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1A1A1A">ThreadLocal</text>
  <rect x="584" y="106" width="152" height="30" fill="#73BE28" fill-opacity="0.20" stroke="#73BE28" rx="2"/>
  <circle cx="660" cy="121" r="6" fill="#73BE28"/>
  <rect x="738" y="106" width="152" height="30" fill="#73BE28" fill-opacity="0.20" stroke="#73BE28" rx="2"/>
  <circle cx="814" cy="121" r="6" fill="#73BE28"/>

  <!-- Row 2: Java 21+ Loom -->
  <rect x="40" y="138" width="220" height="30" fill="#FFFFFF" stroke="#E5E5E5" rx="2"/>
  <text x="50" y="152" font-size="10" font-weight="700" fill="#1A1A1A">Java 21+ (Project Loom)</text>
  <text x="50" y="163" font-size="9" fill="#6F7274">virtual threads on carrier threads</text>
  <rect x="262" y="138" width="320" height="30" fill="#FFFFFF" stroke="#E5E5E5" rx="2"/>
  <text x="272" y="157" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1A1A1A">ScopedValue</text>
