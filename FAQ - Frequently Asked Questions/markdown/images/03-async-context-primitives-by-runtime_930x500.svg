  <text x="272" y="285" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1A1A1A">AsyncLocal&lt;T&gt;</text>
  <rect x="584" y="266" width="152" height="30" fill="#73BE28" fill-opacity="0.20" stroke="#73BE28" rx="2"/>
  <circle cx="660" cy="281" r="6" fill="#73BE28"/>
  <rect x="738" y="266" width="152" height="30" fill="#73BE28" fill-opacity="0.20" stroke="#73BE28" rx="2"/>
  <circle cx="814" cy="281" r="6" fill="#73BE28"/>

