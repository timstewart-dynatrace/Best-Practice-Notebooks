  <text x="50" y="419" font-size="9" fill="#6F7274">request-per-process</text>
  <rect x="262" y="394" width="320" height="30" fill="#FFFFFF" stroke="#E5E5E5" rx="2"/>
  <text x="272" y="413" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1A1A1A">request-scoped globals</text>
  <rect x="584" y="394" width="152" height="30" fill="#73BE28" fill-opacity="0.20" stroke="#73BE28" rx="2"/>
  <circle cx="660" cy="409" r="6" fill="#73BE28"/>
  <rect x="738" y="394" width="152" height="30" fill="#73BE28" fill-opacity="0.20" stroke="#73BE28" rx="2"/>
  <circle cx="814" cy="409" r="6" fill="#73BE28"/>

  <!-- Row 11: Ruby -->
  <rect x="40" y="426" width="220" height="30" fill="#F5F5F5" stroke="#E5E5E5" rx="2"/>
  <text x="50" y="440" font-size="10" font-weight="700" fill="#1A1A1A">Ruby</text>
  <text x="50" y="451" font-size="9" fill="#6F7274">threads + fibers (Async gem)</text>
  <rect x="262" y="426" width="320" height="30" fill="#FFFFFF" stroke="#E5E5E5" rx="2"/>
