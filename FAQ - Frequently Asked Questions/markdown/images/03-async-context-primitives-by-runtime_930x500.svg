  <rect x="40" y="202" width="220" height="30" fill="#FFFFFF" stroke="#E5E5E5" rx="2"/>
  <text x="50" y="216" font-size="10" font-weight="700" fill="#1A1A1A">Scala (classical)</text>
  <text x="50" y="227" font-size="9" fill="#6F7274">Akka, Play, Future / ForkJoinPool</text>
  <rect x="262" y="202" width="320" height="30" fill="#FFFFFF" stroke="#E5E5E5" rx="2"/>
  <text x="272" y="221" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1A1A1A">ThreadLocal</text>
  <rect x="584" y="202" width="152" height="30" fill="#73BE28" fill-opacity="0.20" stroke="#73BE28" rx="2"/>
  <circle cx="660" cy="217" r="6" fill="#73BE28"/>
  <rect x="738" y="202" width="152" height="30" fill="#73BE28" fill-opacity="0.20" stroke="#73BE28" rx="2"/>
  <circle cx="814" cy="217" r="6" fill="#73BE28"/>

