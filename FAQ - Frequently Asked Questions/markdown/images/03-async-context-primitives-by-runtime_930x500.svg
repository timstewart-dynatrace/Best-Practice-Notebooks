  <text x="50" y="387" font-size="9" fill="#6F7274">goroutines + explicit context</text>
  <rect x="262" y="362" width="320" height="30" fill="#FFFFFF" stroke="#E5E5E5" rx="2"/>
  <text x="272" y="381" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1A1A1A">context.Context (function arg)</text>
