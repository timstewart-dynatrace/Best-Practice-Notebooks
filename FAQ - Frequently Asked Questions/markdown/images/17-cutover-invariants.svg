<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" font-family="Inter, system-ui, sans-serif">
  <rect width="930" height="500" fill="#0F172A"/>
  <text x="465" y="34" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">Eight Invariants of Any Migration Cutover</text>
  <text x="465" y="56" text-anchor="middle" fill="#94A3B8" font-size="13">Different sources and tooling, the same eight moving parts — pointing at the series that documents each best</text>
  <defs>
    <marker id="ta" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="30" y="86" width="870" height="40" fill="#FFB800" opacity="0.10" stroke="#FFB800" stroke-width="1.5" rx="6"/>
  <text x="465" y="111" text-anchor="middle" fill="#FCD34D" font-size="13" font-weight="700">1 · Go/No-Go readiness gate — cutover starts on evidence, not a date  (S2S-09)</text>

  <line x1="465" y1="126" x2="465" y2="140" stroke="#64748B" stroke-width="1.5" marker-end="url(#ta)"/>

  <rect x="30" y="142" width="425" height="150" fill="#1496FF" opacity="0.08" stroke="#1496FF" stroke-width="1.5" rx="8"/>
  <text x="242" y="166" text-anchor="middle" fill="#BFDBFE" font-size="14" font-weight="700">The cutover window</text>
  <rect x="48" y="178" width="389" height="30" fill="#1E293B" stroke="#1496FF" rx="5"/>
  <text x="242" y="198" text-anchor="middle" fill="#BFDBFE" font-size="11">2 · Validation ladder — output-parity skipped (SL2DT-09 · NR2DT-08)</text>
  <rect x="48" y="212" width="389" height="30" fill="#1E293B" stroke="#1496FF" rx="5"/>
  <text x="242" y="232" text-anchor="middle" fill="#BFDBFE" font-size="11">3 · Parallel run — with an end date decided up front  (SL2DT-09)</text>
  <rect x="48" y="246" width="389" height="30" fill="#1E293B" stroke="#1496FF" rx="5"/>
  <text x="242" y="266" text-anchor="middle" fill="#BFDBFE" font-size="11">4 · T-minus runbook — T-14 / T-3 / T-0 / T+1  (SL2DT-09)</text>

  <rect x="475" y="142" width="425" height="150" fill="#DE350B" opacity="0.08" stroke="#DE350B" stroke-width="1.5" rx="8"/>
  <text x="687" y="166" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="700">The safety net</text>
  <rect x="493" y="178" width="389" height="46" fill="#1E293B" stroke="#DE350B" rx="5"/>
  <text x="687" y="197" text-anchor="middle" fill="#FCA5A5" font-size="11">5 · Rollback — triggers written BEFORE the procedure</text>
  <text x="687" y="214" text-anchor="middle" fill="#94A3B8" font-size="10">observable thresholds, incl. a time box  (SL2DT-09 · S2S-09)</text>
  <rect x="493" y="230" width="389" height="46" fill="#1E293B" stroke="#DE350B" rx="5"/>
  <text x="687" y="249" text-anchor="middle" fill="#FCA5A5" font-size="11">6 · Decommission — gated on stabilization, not cutover</text>
  <text x="687" y="266" text-anchor="middle" fill="#94A3B8" font-size="10">keep the rollback path alive  (SL2DT-09 · S2S-09)</text>

  <line x1="242" y1="292" x2="242" y2="306" stroke="#64748B" stroke-width="1.5" marker-end="url(#ta)"/>
  <line x1="687" y1="292" x2="687" y2="306" stroke="#64748B" stroke-width="1.5" marker-end="url(#ta)"/>

  <rect x="30" y="308" width="870" height="40" fill="#73BE28" opacity="0.10" stroke="#73BE28" stroke-width="1.5" rx="6"/>
  <text x="465" y="333" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700">7 · Stabilization window — declare done when the tuning backlog shrinks  (SL2DT-09)</text>

  <line x1="465" y1="348" x2="465" y2="362" stroke="#64748B" stroke-width="1.5" marker-end="url(#ta)"/>

  <rect x="30" y="364" width="870" height="40" fill="#A78BFA" opacity="0.10" stroke="#A78BFA" stroke-width="1.5" rx="6"/>
  <text x="465" y="389" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700">8 · Lessons-learned capture — so the next migration doesn't start from zero  (S2S-09)</text>

  <line x1="30" y1="424" x2="900" y2="424" stroke="#334155" stroke-width="1"/>
  <text x="30" y="448" fill="#94A3B8" font-size="11">This entry orchestrates — it names the invariants and routes to the canonical treatment. The migration-specific detail stays in your own series.</text>
  <text x="30" y="466" fill="#94A3B8" font-size="11">Same-answer validation compares VALUES, not row counts: the same entity set can return different name strings (FAQ-16 § 4).</text>
  <text x="30" y="484" fill="#94A3B8" font-size="11">The two gaps most often skipped: rollback triggers (5) and the stabilization window (7).</text>
</svg>
