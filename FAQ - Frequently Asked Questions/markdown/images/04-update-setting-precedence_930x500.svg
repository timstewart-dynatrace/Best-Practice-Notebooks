<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" font-family="Inter, system-ui, sans-serif">
  <rect width="930" height="500" fill="#0F172A"/>

  <text x="465" y="38" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">OneAgent Update Setting Precedence</text>
  <text x="465" y="62" text-anchor="middle" fill="#94A3B8" font-size="13">Most specific scope wins — narrowest override applies</text>

  <defs>
    <marker id="arrow-04a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Tenant default (broadest) -->
  <rect x="80" y="100" width="770" height="90" fill="#1496FF" opacity="0.08" stroke="#1496FF" stroke-width="1.5" rx="8"/>
  <text x="465" y="130" text-anchor="middle" fill="#BFDBFE" font-size="15" font-weight="700">Tenant default</text>
  <text x="465" y="152" text-anchor="middle" fill="#94A3B8" font-size="12">Environment-wide baseline — applies to every host unless overridden below</text>
  <text x="465" y="172" text-anchor="middle" fill="#94A3B8" font-size="11">Settings → Fleet management → OneAgent version and updates (Classic: Settings → Updates → OneAgent updates)</text>

  <!-- Host group override -->
  <rect x="160" y="225" width="610" height="90" fill="#FFB800" opacity="0.08" stroke="#FFB800" stroke-width="1.5" rx="8"/>
  <text x="465" y="255" text-anchor="middle" fill="#FCD34D" font-size="15" font-weight="700">Host group override</text>
  <text x="465" y="277" text-anchor="middle" fill="#94A3B8" font-size="12">Overrides tenant default for all hosts in the group</text>
  <text x="465" y="297" text-anchor="middle" fill="#94A3B8" font-size="11">Fleet Management → host group details → Configure updates (Classic: Host group settings → OneAgent updates)</text>

  <!-- Individual host override -->
  <rect x="260" y="350" width="410" height="90" fill="#73BE28" opacity="0.08" stroke="#73BE28" stroke-width="1.5" rx="8"/>
  <text x="465" y="380" text-anchor="middle" fill="#86EFAC" font-size="15" font-weight="700">Individual host override</text>
  <text x="465" y="402" text-anchor="middle" fill="#94A3B8" font-size="12">Per-host setting — wins over host group and tenant</text>
  <text x="465" y="422" text-anchor="middle" fill="#94A3B8" font-size="11">Fleet Management → host details → Configure updates</text>

  <!-- Arrows showing override flow -->
  <line x1="465" y1="190" x2="465" y2="220" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-04a)"/>
  <line x1="465" y1="315" x2="465" y2="345" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-04a)"/>

  <!-- Footer note -->
  <text x="465" y="475" text-anchor="middle" fill="#94A3B8" font-size="11">Three modes available at every scope: Automatic updates at earliest convenience · Automatic updates during update windows · No automatic updates</text>
</svg>
