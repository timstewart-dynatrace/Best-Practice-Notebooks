<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" font-family="Inter, system-ui, sans-serif">
  <rect width="930" height="500" fill="#0F172A"/>

  <text x="465" y="34" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">Custom SQL Server Scripts or the Dynatrace Extension?</text>
  <text x="465" y="57" text-anchor="middle" fill="#94A3B8" font-size="13">A typical homegrown monitor set maps almost entirely onto the Hub extension — keep custom collection only for true gaps.</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- LEFT: homegrown today -->
  <rect x="24" y="92" width="240" height="256" fill="#1496FF" opacity="0.10" stroke="#1496FF" stroke-width="1.5" rx="6"/>
  <text x="144" y="116" text-anchor="middle" fill="#BFDBFE" font-size="13" font-weight="700">Today: homegrown monitoring</text>
  <text x="144" y="134" text-anchor="middle" fill="#94A3B8" font-size="10.5">Telegraf SQL input + custom T-SQL</text>
  <text x="40" y="160" fill="#CBD5E1" font-size="11">• Blocked sessions</text>
  <text x="40" y="178" fill="#CBD5E1" font-size="11">• Database status</text>
  <text x="40" y="196" fill="#CBD5E1" font-size="11">• Agent job outcomes</text>
  <text x="40" y="214" fill="#CBD5E1" font-size="11">• Log space utilization</text>
  <text x="40" y="232" fill="#CBD5E1" font-size="11">• Always On sync health / failover</text>
  <text x="40" y="250" fill="#CBD5E1" font-size="11">• Instance status</text>
  <text x="40" y="272" fill="#FCD34D" font-size="11">• tempdb version store</text>
  <text x="40" y="290" fill="#FCD34D" font-size="11">• Filegroup rollup</text>
  <text x="144" y="322" text-anchor="middle" fill="#64748B" font-size="10">You build it, you patch it,</text>
  <text x="144" y="336" text-anchor="middle" fill="#64748B" font-size="10">you maintain it — forever.</text>

  <!-- arrow: most monitors to extension -->
  <line x1="264" y1="180" x2="344" y2="180" stroke="#73BE28" stroke-width="2" marker-end="url(#ar)"/>
  <text x="304" y="168" text-anchor="middle" fill="#86EFAC" font-size="10" font-weight="700">most monitors</text>

  <!-- CENTER: extension -->
  <rect x="348" y="92" width="330" height="256" fill="#73BE28" opacity="0.10" stroke="#73BE28" stroke-width="1.5" rx="6"/>
  <text x="513" y="116" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700">Microsoft SQL Server extension</text>
  <text x="513" y="134" text-anchor="middle" fill="#94A3B8" font-size="10.5">Dynatrace Hub — runs on an ActiveGate, SELECT-only</text>
  <text x="364" y="160" fill="#CBD5E1" font-size="11">Covers the typical monitor set out of the box:</text>
  <text x="364" y="180" fill="#F8FAFC" font-size="11" font-weight="700">Default · Database Files · Transaction Logs</text>
  <text x="364" y="198" fill="#F8FAFC" font-size="11" font-weight="700">Always On · Jobs · Agent  (+ 8 more feature sets)</text>
  <text x="364" y="222" fill="#CBD5E1" font-size="11">sql-server.* metrics + job-outcome log streams</text>
  <rect x="364" y="238" width="298" height="92" fill="#73BE28" opacity="0.08" stroke="#73BE28" stroke-width="1" rx="4"/>
  <text x="513" y="258" text-anchor="middle" fill="#86EFAC" font-size="11" font-weight="700">What scripts can never give you</text>
  <text x="376" y="278" fill="#CBD5E1" font-size="10.5">✓ Topology + first-class Smartscape entities</text>
  <text x="376" y="296" fill="#CBD5E1" font-size="10.5">✓ Entity-aware Davis root-cause correlation</text>
  <text x="376" y="314" fill="#CBD5E1" font-size="10.5">✓ Maintained by Dynatrace — zero script drift</text>

  <!-- arrow: gaps to EF2.0 -->
  <line x1="264" y1="284" x2="300" y2="284" stroke="#FCD34D" stroke-width="2"/>
  <line x1="300" y1="284" x2="300" y2="398" stroke="#FCD34D" stroke-width="2"/>
  <line x1="300" y1="398" x2="344" y2="398" stroke="#FCD34D" stroke-width="2" marker-end="url(#ar)"/>
  <text x="304" y="380" text-anchor="middle" fill="#FCD34D" font-size="10" font-weight="700">true gaps</text>

  <!-- BOTTOM CENTER: EF 2.0 custom -->
  <rect x="348" y="366" width="330" height="72" fill="#A78BFA" opacity="0.10" stroke="#A78BFA" stroke-width="1.5" rx="6"/>
  <text x="513" y="390" text-anchor="middle" fill="#DDD6FE" font-size="12" font-weight="700">Small custom Extensions 2.0 SQL extension</text>
  <text x="513" y="408" text-anchor="middle" fill="#CBD5E1" font-size="10.5">Single-SELECT queries, same ActiveGate, same monitoring user</text>
  <text x="513" y="424" text-anchor="middle" fill="#94A3B8" font-size="10">You own it — but it shrinks to only what the extension lacks</text>

  <!-- RIGHT: outcomes -->
  <rect x="694" y="92" width="212" height="256" fill="#1E293B" stroke="#475569" stroke-width="1" rx="6"/>
  <text x="800" y="116" text-anchor="middle" fill="#F8FAFC" font-size="13" font-weight="700">Operate in Dynatrace</text>
  <text x="708" y="144" fill="#CBD5E1" font-size="10.5">• Metric events / Davis anomaly</text>
  <text x="708" y="160" fill="#CBD5E1" font-size="10.5">   detectors on sql-server.* keys</text>
  <text x="708" y="182" fill="#CBD5E1" font-size="10.5">• DQL log alerts on failed_jobs</text>
  <text x="708" y="198" fill="#CBD5E1" font-size="10.5">   (error text is queryable)</text>
  <text x="708" y="220" fill="#CBD5E1" font-size="10.5">• Dashboards + notebooks over</text>
  <text x="708" y="236" fill="#CBD5E1" font-size="10.5">   Grail with full topology context</text>
  <text x="708" y="258" fill="#CBD5E1" font-size="10.5">• Retire the script estate after a</text>
  <text x="708" y="274" fill="#CBD5E1" font-size="10.5">   parallel-run validation window</text>
  <line x1="678" y1="220" x2="690" y2="220" stroke="#64748B" stroke-width="2" marker-end="url(#ar)"/>

  <!-- FOOTER: fallback -->
  <rect x="24" y="454" width="882" height="34" fill="#1E293B" rx="4"/>
  <text x="465" y="475" text-anchor="middle" fill="#94A3B8" font-size="11">Fallback: keep Telegraf → Dynatrace metrics API — queries unchanged, but you forfeit topology, Smartscape entities, and entity-aware Davis correlation.</text>
</svg>
