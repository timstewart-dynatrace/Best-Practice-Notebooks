<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" font-family="Inter, system-ui, sans-serif">
  <rect width="930" height="500" fill="#0F172A"/>

  <defs>
    <marker id="fa19b-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="fa19b-arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DE350B"/>
    </marker>
  </defs>

  <text x="465" y="36" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">Extract, Then Discard — Stage Order Decides Whether It Works</text>
  <text x="465" y="60" text-anchor="middle" fill="#94A3B8" font-size="13">Two processors both stop retention. Only one of them lets you extract first.</text>

  <!-- Pipeline stages -->
  <text x="52" y="112" fill="#F8FAFC" font-size="13" font-weight="700">OpenPipeline stages, in order</text>

  <!-- Stage boxes -->
  <rect x="40" y="126" width="128" height="64" fill="#DE350B" opacity="0.10" stroke="#DE350B" stroke-width="2" rx="6"/>
  <text x="104" y="150" text-anchor="middle" fill="#FCA5A5" font-size="13" font-weight="700">1 Processing</text>
  <text x="104" y="169" text-anchor="middle" fill="#94A3B8" font-size="10">parse · mask · hash</text>
  <text x="104" y="182" text-anchor="middle" fill="#94A3B8" font-size="10">rename</text>

  <line x1="168" y1="158" x2="192" y2="158" stroke="#64748B" stroke-width="1.5" marker-end="url(#fa19b-arrow)"/>

  <rect x="192" y="126" width="128" height="64" fill="#1496FF" opacity="0.10" stroke="#1496FF" stroke-width="1.5" rx="6"/>
  <text x="256" y="150" text-anchor="middle" fill="#BFDBFE" font-size="13" font-weight="700">2–3 Smartscape</text>
  <text x="256" y="166" text-anchor="middle" fill="#BFDBFE" font-size="13" font-weight="700">node + edge</text>
  <text x="256" y="183" text-anchor="middle" fill="#94A3B8" font-size="10">topology extraction</text>

  <line x1="320" y1="158" x2="344" y2="158" stroke="#64748B" stroke-width="1.5" marker-end="url(#fa19b-arrow)"/>

  <rect x="344" y="126" width="150" height="64" fill="#1E293B" stroke="#475569" stroke-width="1.5" rx="6"/>
  <text x="419" y="152" text-anchor="middle" fill="#CBD5E1" font-size="12" font-weight="700">4–6</text>
  <text x="419" y="170" text-anchor="middle" fill="#94A3B8" font-size="10">permission ·</text>
  <text x="419" y="183" text-anchor="middle" fill="#94A3B8" font-size="10">product + cost allocation</text>

  <line x1="494" y1="158" x2="518" y2="158" stroke="#64748B" stroke-width="1.5" marker-end="url(#fa19b-arrow)"/>

  <rect x="518" y="126" width="128" height="64" fill="#73BE28" opacity="0.10" stroke="#73BE28" stroke-width="2" rx="6"/>
  <text x="582" y="150" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700">7 Bucket</text>
  <text x="582" y="166" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700">assignment</text>
  <text x="582" y="183" text-anchor="middle" fill="#94A3B8" font-size="10">bucket or no storage</text>

  <line x1="646" y1="158" x2="670" y2="158" stroke="#64748B" stroke-width="1.5" marker-end="url(#fa19b-arrow)"/>

  <rect x="670" y="126" width="100" height="64" fill="#73BE28" opacity="0.10" stroke="#73BE28" stroke-width="1.5" rx="6"/>
  <text x="720" y="150" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700">8 Metric</text>
  <text x="720" y="166" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700">extraction</text>
  <text x="720" y="183" text-anchor="middle" fill="#94A3B8" font-size="10">durable metrics</text>

  <line x1="770" y1="158" x2="794" y2="158" stroke="#64748B" stroke-width="1.5" marker-end="url(#fa19b-arrow)"/>

  <rect x="794" y="126" width="96" height="64" fill="#A78BFA" opacity="0.10" stroke="#A78BFA" stroke-width="1.5" rx="6"/>
  <text x="842" y="150" text-anchor="middle" fill="#DDD6FE" font-size="12" font-weight="700">9–10 Davis</text>
  <text x="842" y="166" text-anchor="middle" fill="#DDD6FE" font-size="12" font-weight="700">+ data</text>
  <text x="842" y="183" text-anchor="middle" fill="#94A3B8" font-size="10">event extraction</text>

  <!-- WRONG panel -->
  <rect x="40" y="228" width="410" height="240" fill="#DE350B" opacity="0.08" stroke="#DE350B" stroke-width="1.5" rx="8"/>
  <text x="245" y="256" text-anchor="middle" fill="#FCA5A5" font-size="15" font-weight="700">✗  Drop record — in stage 1</text>

  <rect x="62" y="272" width="366" height="52" fill="#1E293B" stroke="#DE350B" rx="6"/>
  <text x="245" y="293" text-anchor="middle" fill="#FCA5A5" font-size="12" font-weight="600">Record is gone before stages 2–10 ever run</text>
  <text x="245" y="312" text-anchor="middle" fill="#94A3B8" font-size="11">no metric · no topology · no event</text>

  <line x1="104" y1="196" x2="104" y2="266" stroke="#DE350B" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#fa19b-arrow-red)"/>

  <text x="62" y="352" fill="#F8FAFC" font-size="12" font-weight="700">What you observe</text>
  <text x="62" y="374" fill="#94A3B8" font-size="11">• Pipeline reports healthy</text>
  <text x="62" y="394" fill="#94A3B8" font-size="11">• Storage bill falls exactly as predicted</text>
  <text x="62" y="414" fill="#94A3B8" font-size="11">• The metrics you built this for never appear</text>

  <rect x="62" y="428" width="366" height="28" fill="#DE350B" opacity="0.15" stroke="#DE350B" rx="4"/>
  <text x="245" y="447" text-anchor="middle" fill="#FCA5A5" font-size="11" font-weight="600">Correct use: records you want gone entirely</text>

  <!-- RIGHT panel -->
  <rect x="480" y="228" width="410" height="240" fill="#73BE28" opacity="0.08" stroke="#73BE28" stroke-width="1.5" rx="8"/>
  <text x="685" y="256" text-anchor="middle" fill="#86EFAC" font-size="15" font-weight="700">✓  No storage assignment — in stage 7</text>

  <rect x="502" y="272" width="366" height="52" fill="#1E293B" stroke="#73BE28" rx="6"/>
  <text x="685" y="293" text-anchor="middle" fill="#86EFAC" font-size="12" font-weight="600">Record continues through stages 8–10, then is not stored</text>
  <text x="685" y="312" text-anchor="middle" fill="#94A3B8" font-size="11">metric ✓ · topology ✓ · event ✓ · storage ✗</text>

  <line x1="582" y1="196" x2="582" y2="226" stroke="#73BE28" stroke-width="2" stroke-dasharray="4,3"/>

  <text x="502" y="352" fill="#F8FAFC" font-size="12" font-weight="700">What you keep</text>
  <text x="502" y="374" fill="#94A3B8" font-size="11">• Metrics for dashboards, Davis, and SLOs</text>
  <text x="502" y="394" fill="#94A3B8" font-size="11">• Business and problem events with entity context</text>
  <text x="502" y="414" fill="#94A3B8" font-size="11">• No raw identities or destinations at rest</text>

  <rect x="502" y="428" width="366" height="28" fill="#73BE28" opacity="0.15" stroke="#73BE28" rx="4"/>
  <text x="685" y="447" text-anchor="middle" fill="#86EFAC" font-size="11" font-weight="600">Correct use: the extract-then-discard pattern</text>
</svg>
