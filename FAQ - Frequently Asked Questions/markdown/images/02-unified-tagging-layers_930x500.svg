<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" width="930" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="930" height="500" fill="#0F172A"/>

  <text x="30" y="30" fill="#F8FAFC" font-size="17" font-weight="700">Unified tagging: one value, set once, read by every control plane</text>
  <text x="30" y="47" fill="#94A3B8" font-size="11">Primary Grail fields and tags propagate from the signal to everything derived from it — service metrics, Davis events, problems</text>

  <!-- ================= LAYER 1 — SOURCES ================= -->
  <rect x="24" y="58" width="882" height="62" rx="6" fill="#111C30" stroke="#1E293B"/>
  <text x="36" y="76" fill="#64748B" font-size="10" font-weight="700" letter-spacing="1.2">1 · SET AT THE SOURCE (PREFERRED)</text>
  <g font-size="10" fill="#CBD5E1">
    <rect x="36" y="84" width="150" height="26" rx="4" fill="#1E293B" stroke="#334155"/>
    <text x="46" y="101">OneAgent host tag</text>
    <rect x="194" y="84" width="150" height="26" rx="4" fill="#1E293B" stroke="#334155"/>
    <text x="204" y="101">DT_TAGS (per process)</text>
    <rect x="352" y="84" width="186" height="26" rx="4" fill="#1E293B" stroke="#334155"/>
    <text x="362" y="101">K8s namespace labels / annotations</text>
    <rect x="546" y="84" width="166" height="26" rx="4" fill="#1E293B" stroke="#334155"/>
    <text x="556" y="101">OTel resource attributes</text>
    <rect x="720" y="84" width="174" height="26" rx="4" fill="#1E293B" stroke="#334155"/>
    <text x="730" y="101" font-size="9">Central config · OpenPipeline</text>
  </g>

  <path d="M465 120 L465 132" stroke="#475569" stroke-width="1.5"/>
  <path d="M465 138 l-5 -8 h10 z" fill="#475569"/>

  <!-- ================= LAYER 2 — THE TAG MODEL ================= -->
  <rect x="24" y="138" width="882" height="84" rx="6" fill="#152238" stroke="#2B3A55"/>
  <text x="36" y="156" fill="#64748B" font-size="10" font-weight="700" letter-spacing="1.2">2 · THE UNIFIED TAG MODEL — PRIMARY GRAIL FIELDS AND TAGS</text>

  <rect x="36" y="164" width="418" height="48" rx="5" fill="#1E293B" stroke="#3B82F6" stroke-opacity="0.5"/>
  <text x="48" y="182" fill="#BFDBFE" font-size="11" font-weight="700">Your own tags — primary_tags.&lt;key&gt;</text>
  <text x="48" y="200" fill="#94A3B8" font-size="10">primary_tags.team · primary_tags.app · primary_tags.stage</text>

  <rect x="470" y="164" width="424" height="48" rx="5" fill="#1E293B" stroke="#FCD34D" stroke-opacity="0.5"/>
  <text x="482" y="182" fill="#FCD34D" font-size="11" font-weight="700">Reserved fields — applied as-is, no prefix</text>
  <text x="482" y="200" fill="#94A3B8" font-size="10">dt.security_context · dt.cost.costcenter · dt.cost.product</text>

  <!-- fan-out arrows -->
  <g stroke="#475569" stroke-width="1.5" fill="none">
    <path d="M465 222 L465 234"/>
    <path d="M110 234 L110 244 M255 234 L255 244 M400 234 L400 244 M545 234 L545 244 M690 234 L690 244 M835 234 L835 244"/>
    <path d="M110 234 H835" stroke-dasharray="2 3"/>
  </g>

  <!-- ================= LAYER 3 — CONTROL PLANES ================= -->
  <text x="36" y="262" fill="#64748B" font-size="10" font-weight="700" letter-spacing="1.2">3 · WHAT READS THE SAME VALUE</text>

  <!-- Permissions -->
  <rect x="34" y="270" width="132" height="116" rx="6" fill="#1E293B" stroke="#DE350B" stroke-opacity="0.65"/>
  <text x="46" y="290" fill="#FCA5A5" font-size="12" font-weight="700">Permissions</text>
  <text x="46" y="308" fill="#CBD5E1" font-size="9">IAM policies and</text>
  <text x="46" y="320" fill="#CBD5E1" font-size="9">boundaries filter on</text>
  <text x="46" y="334" fill="#F8FAFC" font-size="9" font-weight="600">dt.security_context</text>
  <text x="46" y="352" fill="#94A3B8" font-size="9">Record level, every</text>
  <text x="46" y="364" fill="#94A3B8" font-size="9">signal type</text>
  <text x="46" y="378" fill="#FCA5A5" font-size="9" font-weight="600">Grants access</text>

  <!-- Segments -->
  <rect x="180" y="270" width="132" height="116" rx="6" fill="#1E293B" stroke="#1496FF" stroke-opacity="0.65"/>
  <text x="192" y="290" fill="#BFDBFE" font-size="12" font-weight="700">Segments</text>
  <text x="192" y="308" fill="#CBD5E1" font-size="9">Saved filters over the</text>
  <text x="192" y="320" fill="#CBD5E1" font-size="9">same fields and tags</text>
  <text x="192" y="338" fill="#94A3B8" font-size="9">Narrow the view for</text>
  <text x="192" y="350" fill="#94A3B8" font-size="9">whoever applies one</text>
  <text x="192" y="368" fill="#93C5FD" font-size="9" font-weight="600">Grants nothing —</text>
  <text x="192" y="380" fill="#93C5FD" font-size="9" font-weight="600">runs inside IAM</text>

  <!-- Ownership -->
  <rect x="326" y="270" width="132" height="116" rx="6" fill="#1E293B" stroke="#FFB800" stroke-opacity="0.65"/>
  <text x="338" y="290" fill="#FCD34D" font-size="12" font-weight="700">Ownership</text>
  <text x="338" y="308" fill="#F8FAFC" font-size="9" font-weight="600">primary_tags.team</text>
  <text x="338" y="322" fill="#CBD5E1" font-size="9">on the signal — and</text>
  <text x="338" y="334" fill="#CBD5E1" font-size="9">on the problem</text>
  <text x="338" y="352" fill="#94A3B8" font-size="9">Routes problem-</text>
  <text x="338" y="364" fill="#94A3B8" font-size="9">triggered workflows</text>
  <text x="338" y="378" fill="#FCD34D" font-size="9" font-weight="600">Who gets paged</text>

  <!-- Cost allocation -->
  <rect x="472" y="270" width="132" height="116" rx="6" fill="#1E293B" stroke="#34D399" stroke-opacity="0.65"/>
  <text x="484" y="290" fill="#A7F3D0" font-size="12" font-weight="700">Cost allocation</text>
  <text x="484" y="308" fill="#F8FAFC" font-size="9" font-weight="600">dt.cost.costcenter</text>
  <text x="484" y="322" fill="#F8FAFC" font-size="9" font-weight="600">dt.cost.product</text>
  <text x="484" y="340" fill="#94A3B8" font-size="9">DPS consumption</text>
  <text x="484" y="352" fill="#94A3B8" font-size="9">split by team or</text>
  <text x="484" y="364" fill="#94A3B8" font-size="9">product</text>
  <text x="484" y="378" fill="#A7F3D0" font-size="9" font-weight="600">Who pays</text>

  <!-- Compliance -->
  <rect x="618" y="270" width="132" height="116" rx="6" fill="#1E293B" stroke="#A78BFA" stroke-opacity="0.65"/>
  <text x="630" y="290" fill="#DDD6FE" font-size="12" font-weight="700">Compliance</text>
  <text x="630" y="308" fill="#CBD5E1" font-size="9">Bucket routing and</text>
  <text x="630" y="320" fill="#CBD5E1" font-size="9">retention per scope</text>
  <text x="630" y="338" fill="#94A3B8" font-size="9">Scoped access is</text>
  <text x="630" y="350" fill="#94A3B8" font-size="9">auditable per team</text>
  <text x="630" y="368" fill="#DDD6FE" font-size="9" font-weight="600">What you can</text>
  <text x="630" y="380" fill="#DDD6FE" font-size="9" font-weight="600">prove later</text>

  <!-- Spaces (SaaS 1.348, rolling out) -->
  <rect x="764" y="270" width="132" height="116" rx="6" fill="#161F33" stroke="#64748B" stroke-dasharray="4 3"/>
  <text x="776" y="288" fill="#94A3B8" font-size="12" font-weight="700">Spaces</text>
  <text x="776" y="303" fill="#CBD5E1" font-size="10" font-weight="700">SaaS 1.348 rollout</text>
  <text x="776" y="320" fill="#94A3B8" font-size="9">Data access scoped</text>
  <text x="776" y="332" fill="#94A3B8" font-size="9">by space membership</text>
  <text x="776" y="344" fill="#94A3B8" font-size="9">(dt.space in Grail)</text>
  <text x="776" y="362" fill="#64748B" font-size="9">Config ownership:</text>
  <text x="776" y="374" fill="#64748B" font-size="9">not yet documented</text>
  <text x="776" y="386" fill="#64748B" font-size="9">verify in your tenant</text>

  <!-- ================= LAYER 4 — OUTCOMES ================= -->
  <rect x="24" y="400" width="882" height="46" rx="6" fill="#111C30" stroke="#1E293B"/>
  <text x="36" y="418" fill="#64748B" font-size="10" font-weight="700" letter-spacing="1.2">4 · THE QUESTIONS THESE ANSWER</text>
  <g font-size="10" fill="#CBD5E1">
    <text x="36" y="436">Who may see this record?</text>
    <text x="252" y="436">Who gets paged about it?</text>
    <text x="468" y="436">Whose budget does it consume?</text>
    <text x="722" y="436">Can we prove it held?</text>
  </g>

  <text x="30" y="468" fill="#94A3B8" font-size="10">One value per record does all of this. A tag set only in a segment, or only in a dashboard filter, does none of it.</text>
  <text x="30" y="484" fill="#64748B" font-size="9">Sources: Configure security context · Primary Grail fields and tags · Visibility of segments (DT docs), read 09/21/2026.</text>
</svg>
