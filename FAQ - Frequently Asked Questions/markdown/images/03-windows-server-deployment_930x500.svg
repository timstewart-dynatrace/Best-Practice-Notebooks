<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" font-family="Inter, system-ui, sans-serif">
  <rect width="930" height="500" fill="#0F172A"/>

  <!-- Title -->
  <text x="465" y="36" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">Deploying to Windows Server</text>
  <text x="465" y="58" text-anchor="middle" fill="#94A3B8" font-size="13">The decision is runtime-driven, not OS-driven — but deployment mechanics and the .NET Framework / IIS factor differ</text>

  <!-- LEFT: OneAgent -->
  <rect x="30" y="78" width="420" height="300" fill="#73BE28" opacity="0.08" stroke="#73BE28" stroke-width="1.5" rx="8"/>
  <text x="240" y="103" text-anchor="middle" fill="#86EFAC" font-size="16" font-weight="700">OneAgent on Windows</text>

  <rect x="50" y="118" width="380" height="54" fill="#1E293B" stroke="#73BE28" rx="6"/>
  <text x="240" y="139" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700">MSI installer → runs as SYSTEM service</text>
  <text x="240" y="158" text-anchor="middle" fill="#94A3B8" font-size="11">Server Core supported via headless-mode install</text>

  <rect x="50" y="182" width="380" height="60" fill="#1E293B" stroke="#73BE28" rx="6"/>
  <text x="240" y="203" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700">Auto-injects IIS application pools (w3wp.exe)</text>
  <text x="240" y="221" text-anchor="middle" fill="#94A3B8" font-size="11">Classic .NET Framework 4.5.2–4.8, 3.5 SP1</text>
  <text x="240" y="236" text-anchor="middle" fill="#94A3B8" font-size="11">Modern .NET 5–10 + .NET Core 2.1–3.1</text>

  <rect x="50" y="252" width="380" height="48" fill="#1E293B" stroke="#73BE28" rx="6"/>
  <text x="240" y="272" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700">Logs + traces + metrics + Smartscape</text>
  <text x="240" y="289" text-anchor="middle" fill="#94A3B8" font-size="11">Event Log + IIS logs, PurePath, automatic dependency map</text>

  <rect x="50" y="310" width="380" height="52" fill="#73BE28" opacity="0.12" stroke="#73BE28" rx="6"/>
  <text x="240" y="331" text-anchor="middle" fill="#86EFAC" font-size="12" font-weight="700">Lowest-effort path on a .NET Framework / IIS estate</text>
  <text x="240" y="349" text-anchor="middle" fill="#94A3B8" font-size="11">Deep monitoring with no code change</text>

  <!-- RIGHT: OpenTelemetry -->
  <rect x="480" y="78" width="420" height="300" fill="#1496FF" opacity="0.08" stroke="#1496FF" stroke-width="1.5" rx="8"/>
  <text x="690" y="103" text-anchor="middle" fill="#BFDBFE" font-size="16" font-weight="700">OpenTelemetry on Windows</text>

  <rect x="500" y="118" width="380" height="54" fill="#1E293B" stroke="#1496FF" rx="6"/>
  <text x="690" y="139" text-anchor="middle" fill="#BFDBFE" font-size="13" font-weight="700">Collector MSI → "OpenTelemetry Collector" service</text>
  <text x="690" y="158" text-anchor="middle" fill="#94A3B8" font-size="11">Runs as a Windows service; logs to Event Log</text>

  <rect x="500" y="182" width="380" height="60" fill="#1E293B" stroke="#1496FF" rx="6"/>
  <text x="690" y="203" text-anchor="middle" fill="#BFDBFE" font-size="13" font-weight="700">.NET auto-instrumentation injector</text>
  <text x="690" y="221" text-anchor="middle" fill="#94A3B8" font-size="11">Per-IIS-app-pool environment variables required</text>
  <text x="690" y="236" text-anchor="middle" fill="#94A3B8" font-size="11">Strong for ASP.NET Core; narrower for Framework</text>

  <rect x="500" y="252" width="380" height="48" fill="#1E293B" stroke="#1496FF" rx="6"/>
  <text x="690" y="272" text-anchor="middle" fill="#BFDBFE" font-size="13" font-weight="700">Logs + traces + metrics via Collector — no Smartscape</text>
  <text x="690" y="289" text-anchor="middle" fill="#94A3B8" font-size="11">windowseventlog + filelog receivers; OTLP spans; no topology</text>

  <rect x="500" y="310" width="380" height="52" fill="#1496FF" opacity="0.12" stroke="#1496FF" rx="6"/>
  <text x="690" y="331" text-anchor="middle" fill="#BFDBFE" font-size="12" font-weight="700">Keep for custom spans + multi-backend portability</text>
  <text x="690" y="349" text-anchor="middle" fill="#94A3B8" font-size="11">Layer alongside OneAgent — do not rip out</text>

  <!-- Decisive factor strip -->
  <rect x="30" y="392" width="870" height="42" fill="#FFB800" opacity="0.10" stroke="#FFB800" stroke-width="1.5" rx="8"/>
  <text x="465" y="409" text-anchor="middle" fill="#FCD34D" font-size="13" font-weight="700">Decisive Windows factor: classic ASP.NET / WCF / MSMQ on IIS</text>
  <text x="465" y="426" text-anchor="middle" fill="#94A3B8" font-size="11">OneAgent auto-instruments these; OTel .NET coverage of .NET Framework is narrower and more manual</text>

  <!-- Containers caveat strip -->
  <rect x="30" y="444" width="870" height="40" fill="#A78BFA" opacity="0.10" stroke="#A78BFA" stroke-width="1.5" rx="8"/>
  <text x="465" y="461" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700">Windows containers on Kubernetes: no documented OneAgent path</text>
  <text x="465" y="477" text-anchor="middle" fill="#94A3B8" font-size="11">AKS: "Windows Pods and Nodes unsupported" — instrument with OTel in the container, or record a gap</text>
</svg>
