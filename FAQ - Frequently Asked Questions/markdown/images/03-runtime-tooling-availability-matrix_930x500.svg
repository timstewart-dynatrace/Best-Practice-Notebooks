  <!-- Negative-space callout -->
  <rect x="40" y="402" width="850" height="58" fill="#1496FF" fill-opacity="0.10" stroke="#1496FF" stroke-width="1.5" rx="6"/>
  <text x="465" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A">Why "rip-and-replace" (Path C) is impossible for Go, PHP, and Ruby</text>
  <text x="465" y="440" text-anchor="middle" font-size="10" fill="#454646">No OneAgent SDK for custom tracing exists here (the Go / PHP SDKs only expose trace context for logs).</text>
  <text x="465" y="454" text-anchor="middle" font-size="10" fill="#454646">Python has a GA OneAgent SDK, but Dynatrace recommends OneAgent auto-instrumentation over it.</text>

  <text x="465" y="490" text-anchor="middle" font-size="10" font-style="italic" fill="#6F7274">Read across each row: which tooling is available for that runtime — and where the gaps make a conversion infeasible.</text>
