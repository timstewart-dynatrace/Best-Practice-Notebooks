<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" font-family="Inter, system-ui, sans-serif">
  <rect width="930" height="500" fill="#0F172A"/>

  <!-- Title -->
  <text x="465" y="32" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="700">Ephemeral Platform Token Minting — Trust Chain</text>
  <text x="465" y="54" text-anchor="middle" fill="#94A3B8" font-size="12">One persistent secret (OAuth client) → short-lived per-job token → audited Service User identity</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFB800"/>
    </marker>
  </defs>

  <!-- Layer 1: CI Runner / OAuth Client (info-blue) -->
  <rect x="30" y="85" width="200" height="320" fill="#1496FF" opacity="0.08" stroke="#1496FF" stroke-width="1.5" rx="8"/>
  <text x="130" y="108" text-anchor="middle" fill="#BFDBFE" font-size="14" font-weight="700">CI Runner</text>
  <text x="130" y="125" text-anchor="middle" fill="#94A3B8" font-size="11">Long-lived bootstrap secret</text>

  <rect x="50" y="145" width="160" height="70" fill="#1E293B" stroke="#1496FF" rx="6"/>
  <text x="130" y="168" text-anchor="middle" fill="#BFDBFE" font-size="13" font-weight="600">OAuth Client</text>
  <text x="130" y="186" text-anchor="middle" fill="#94A3B8" font-size="10">client_id + secret</text>
  <text x="130" y="202" text-anchor="middle" fill="#94A3B8" font-size="10">in Vault / KMS</text>

  <rect x="50" y="230" width="160" height="55" fill="#1E293B" stroke="#1496FF" rx="6"/>
  <text x="130" y="252" text-anchor="middle" fill="#BFDBFE" font-size="12" font-weight="600">OAuth scope</text>
  <text x="130" y="270" text-anchor="middle" fill="#FCD34D" font-size="10" font-family="monospace">platform-token:tokens:manage</text>

  <rect x="50" y="300" width="160" height="90" fill="#1E293B" stroke="#1496FF" rx="6"/>
  <text x="130" y="322" text-anchor="middle" fill="#BFDBFE" font-size="12" font-weight="600">Per-job lifecycle</text>
  <text x="130" y="342" text-anchor="middle" fill="#94A3B8" font-size="10">1. sweep expired</text>
  <text x="130" y="358" text-anchor="middle" fill="#94A3B8" font-size="10">2. mint (1h TTL)</text>
  <text x="130" y="374" text-anchor="middle" fill="#94A3B8" font-size="10">3. delete (if: always)</text>

  <!-- Arrow 1: OAuth exchange -->
  <line x1="230" y1="180" x2="270" y2="180" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="170" text-anchor="middle" fill="#94A3B8" font-size="9">OIDC →</text>
  <text x="250" y="194" text-anchor="middle" fill="#94A3B8" font-size="9">bearer</text>

  <!-- Layer 2: DT IAM (purple) -->
  <rect x="270" y="85" width="200" height="320" fill="#A78BFA" opacity="0.08" stroke="#A78BFA" stroke-width="1.5" rx="8"/>
  <text x="370" y="108" text-anchor="middle" fill="#DDD6FE" font-size="14" font-weight="700">Dynatrace IAM</text>
  <text x="370" y="125" text-anchor="middle" fill="#94A3B8" font-size="11">Account Management API</text>

  <rect x="290" y="145" width="160" height="70" fill="#1E293B" stroke="#A78BFA" rx="6"/>
  <text x="370" y="167" text-anchor="middle" fill="#DDD6FE" font-size="12" font-weight="600">POST /iam/v1/accounts/</text>
  <text x="370" y="183" text-anchor="middle" fill="#DDD6FE" font-size="12" font-weight="600">{uuid}/platform-tokens</text>
  <text x="370" y="202" text-anchor="middle" fill="#94A3B8" font-size="10">+ userUuid in body</text>

  <rect x="290" y="230" width="160" height="55" fill="#1E293B" stroke="#73BE28" rx="6"/>
  <text x="370" y="251" text-anchor="middle" fill="#86EFAC" font-size="12" font-weight="600">Service User</text>
  <text x="370" y="270" text-anchor="middle" fill="#94A3B8" font-size="10">svc-tf-settings (or per-domain)</text>

  <rect x="290" y="300" width="160" height="90" fill="#1E293B" stroke="#73BE28" rx="6"/>
  <text x="370" y="322" text-anchor="middle" fill="#86EFAC" font-size="12" font-weight="600">IAM Policies</text>
  <text x="370" y="342" text-anchor="middle" fill="#94A3B8" font-size="10">settings:objects:write</text>
  <text x="370" y="358" text-anchor="middle" fill="#94A3B8" font-size="10">(via group binding)</text>
  <text x="370" y="376" text-anchor="middle" fill="#94A3B8" font-size="10">— intersected at mint</text>

  <!-- Arrow 2: Platform Token returned (amber - trust boundary crossing) -->
  <line x1="470" y1="180" x2="520" y2="180" stroke="#FFB800" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <text x="495" y="170" text-anchor="middle" fill="#FCD34D" font-size="9" font-weight="600">Platform</text>
  <text x="495" y="195" text-anchor="middle" fill="#FCD34D" font-size="9" font-weight="600">Token</text>

  <!-- Layer 3: Ephemeral Platform Token (amber) -->
  <rect x="520" y="85" width="180" height="320" fill="#FFB800" opacity="0.08" stroke="#FFB800" stroke-width="1.5" rx="8"/>
  <text x="610" y="108" text-anchor="middle" fill="#FCD34D" font-size="14" font-weight="700">Platform Token</text>
  <text x="610" y="125" text-anchor="middle" fill="#94A3B8" font-size="11">Short-lived, ephemeral</text>

  <rect x="535" y="145" width="150" height="70" fill="#1E293B" stroke="#FFB800" rx="6"/>
  <text x="610" y="167" text-anchor="middle" fill="#FCD34D" font-size="12" font-weight="600">dt0s16.* token</text>
  <text x="610" y="185" text-anchor="middle" fill="#94A3B8" font-size="10">TTL: 1h (configurable)</text>
  <text x="610" y="202" text-anchor="middle" fill="#94A3B8" font-size="10">in CI env var</text>

  <rect x="535" y="230" width="150" height="55" fill="#1E293B" stroke="#FFB800" rx="6"/>
  <text x="610" y="252" text-anchor="middle" fill="#FCD34D" font-size="12" font-weight="600">Effective scopes</text>
  <text x="610" y="270" text-anchor="middle" fill="#94A3B8" font-size="10">= SU policies ∩ requested</text>

  <rect x="535" y="300" width="150" height="90" fill="#1E293B" stroke="#FFB800" rx="6"/>
  <text x="610" y="322" text-anchor="middle" fill="#FCD34D" font-size="12" font-weight="600">Cap headroom</text>
  <text x="610" y="342" text-anchor="middle" fill="#94A3B8" font-size="10">Max 10 per user</text>
  <text x="610" y="358" text-anchor="middle" fill="#94A3B8" font-size="10">per account</text>
  <text x="610" y="376" text-anchor="middle" fill="#94A3B8" font-size="10">(verified at source)</text>

  <!-- Arrow 3: terraform apply -->
  <line x1="700" y1="180" x2="745" y2="180" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="722" y="170" text-anchor="middle" fill="#94A3B8" font-size="9">terraform</text>
  <text x="722" y="195" text-anchor="middle" fill="#94A3B8" font-size="9">apply</text>

  <!-- Layer 4: Dynatrace Platform (cyan) -->
  <rect x="745" y="85" width="155" height="320" fill="#22D3EE" opacity="0.08" stroke="#22D3EE" stroke-width="1.5" rx="8"/>
  <text x="822" y="108" text-anchor="middle" fill="#A5F3FC" font-size="14" font-weight="700">DT Platform</text>
  <text x="822" y="125" text-anchor="middle" fill="#94A3B8" font-size="11">Per-action audit log</text>

  <rect x="760" y="145" width="130" height="70" fill="#1E293B" stroke="#22D3EE" rx="6"/>
  <text x="822" y="167" text-anchor="middle" fill="#A5F3FC" font-size="12" font-weight="600">Settings 2.0</text>
  <text x="822" y="183" text-anchor="middle" fill="#A5F3FC" font-size="12" font-weight="600">/ Gen3 APIs</text>
  <text x="822" y="202" text-anchor="middle" fill="#94A3B8" font-size="10">Bearer auth</text>

  <rect x="760" y="230" width="130" height="55" fill="#1E293B" stroke="#22D3EE" rx="6"/>
  <text x="822" y="252" text-anchor="middle" fill="#A5F3FC" font-size="12" font-weight="600">Audit attribution</text>
  <text x="822" y="270" text-anchor="middle" fill="#94A3B8" font-size="10">→ Service User</text>

  <rect x="760" y="300" width="130" height="90" fill="#1E293B" stroke="#22D3EE" rx="6"/>
  <text x="822" y="322" text-anchor="middle" fill="#A5F3FC" font-size="12" font-weight="600">No state leak</text>
  <text x="822" y="342" text-anchor="middle" fill="#94A3B8" font-size="10">Token never enters</text>
  <text x="822" y="358" text-anchor="middle" fill="#94A3B8" font-size="10">Terraform state</text>
  <text x="822" y="374" text-anchor="middle" fill="#94A3B8" font-size="10">(unlike dt0c01)</text>

  <!-- Footer legend -->
  <line x1="30" y1="430" x2="900" y2="430" stroke="#334155" stroke-width="1"/>
  <text x="40" y="452" fill="#94A3B8" font-size="11" font-weight="600">Trust boundary crossings:</text>
  <line x1="220" y1="448" x2="245" y2="448" stroke="#FFB800" stroke-width="2.5"/>
  <text x="252" y="452" fill="#FCD34D" font-size="10">Platform Token (the load-bearing handoff)</text>
  <line x1="500" y1="448" x2="525" y2="448" stroke="#64748B" stroke-width="1.5"/>
  <text x="532" y="452" fill="#94A3B8" font-size="10">Routine API calls</text>

  <text x="40" y="478" fill="#94A3B8" font-size="11">Pre-mint: list tokens, delete only expired (race-safe under concurrency). Post-job: delete on success or failure.</text>
</svg>
