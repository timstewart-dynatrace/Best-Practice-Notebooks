<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" font-family="Inter, system-ui, sans-serif">
  <rect width="930" height="500" fill="#0F172A"/>

  <!-- Title -->
  <text x="465" y="38" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">Extension Execution Flow</text>
  <text x="465" y="62" text-anchor="middle" fill="#94A3B8" font-size="13">From Hub → AG group or OneAgent → Source → Dynatrace</text>

  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Stage 1: Hub -->
  <rect x="40" y="170" width="160" height="100" fill="#1E293B" stroke="#A78BFA" stroke-width="1.5" rx="6"/>
  <text x="120" y="195" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700">1. Dynatrace Hub</text>
  <text x="120" y="215" text-anchor="middle" fill="#94A3B8" font-size="11">Find extension</text>
  <text x="120" y="231" text-anchor="middle" fill="#94A3B8" font-size="11">(pre-built or custom)</text>
  <text x="120" y="252" text-anchor="middle" fill="#94A3B8" font-size="10">Apps → Hub</text>

  <!-- Arrow 1 -->
  <line x1="200" y1="220" x2="232" y2="220" stroke="#64748B" stroke-width="1.5" marker-end="url(#flow-arrow)"/>

  <!-- Stage 2: Install + Configure -->
  <rect x="240" y="170" width="160" height="100" fill="#1E293B" stroke="#1496FF" stroke-width="1.5" rx="6"/>
  <text x="320" y="195" text-anchor="middle" fill="#BFDBFE" font-size="13" font-weight="700">2. Install &amp; Configure</text>
  <text x="320" y="215" text-anchor="middle" fill="#94A3B8" font-size="11">Endpoint URL</text>
  <text x="320" y="231" text-anchor="middle" fill="#94A3B8" font-size="11">Credentials</text>
  <text x="320" y="247" text-anchor="middle" fill="#94A3B8" font-size="11">Polling interval</text>
  <text x="320" y="262" text-anchor="middle" fill="#94A3B8" font-size="10">Monitoring config</text>

  <!-- Arrow 2 -->
  <line x1="400" y1="220" x2="432" y2="220" stroke="#64748B" stroke-width="1.5" marker-end="url(#flow-arrow)"/>

  <!-- Stage 3: Assign to AG -->
  <rect x="440" y="170" width="160" height="100" fill="#1E293B" stroke="#FFB800" stroke-width="1.5" rx="6"/>
  <text x="520" y="195" text-anchor="middle" fill="#FCD34D" font-size="13" font-weight="700">3. Assign scope</text>
  <text x="520" y="215" text-anchor="middle" fill="#94A3B8" font-size="11">Remote: AG group</text>
  <text x="520" y="231" text-anchor="middle" fill="#94A3B8" font-size="11">Local: OneAgent host</text>
  <text x="520" y="252" text-anchor="middle" fill="#94A3B8" font-size="10">Runs the extension</text>

  <!-- Arrow 3 -->
  <line x1="600" y1="220" x2="632" y2="220" stroke="#64748B" stroke-width="1.5" marker-end="url(#flow-arrow)"/>

  <!-- Stage 4: Poll Source -->
  <rect x="640" y="170" width="160" height="100" fill="#1E293B" stroke="#73BE28" stroke-width="1.5" rx="6"/>
  <text x="720" y="195" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="700">4. Poll Data Source</text>
  <text x="720" y="215" text-anchor="middle" fill="#94A3B8" font-size="11">DB / API / SNMP /</text>
  <text x="720" y="231" text-anchor="middle" fill="#94A3B8" font-size="11">on-host integration</text>
  <text x="720" y="252" text-anchor="middle" fill="#94A3B8" font-size="10">At configured interval</text>

  <!-- Arrow down to Dynatrace -->
  <line x1="720" y1="270" x2="720" y2="332" stroke="#64748B" stroke-width="1.5" marker-end="url(#flow-arrow)"/>

  <!-- Stage 5: Dynatrace Receives -->
  <rect x="320" y="340" width="320" height="80" fill="#1E293B" stroke="#22D3EE" stroke-width="2" rx="6"/>
  <text x="480" y="367" text-anchor="middle" fill="#A5F3FC" font-size="14" font-weight="700">5. Dynatrace Receives</text>
  <text x="480" y="388" text-anchor="middle" fill="#94A3B8" font-size="11">Metrics · Logs · Events from the extension</text>
  <text x="480" y="406" text-anchor="middle" fill="#94A3B8" font-size="10">Routed through OpenPipeline → Grail buckets</text>

  <!-- Arrow from Step 4 sweeping back to Step 5 -->
  <path d="M 720 280 Q 720 320 640 380" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Generation labels -->
  <rect x="40" y="100" width="380" height="40" fill="#73BE28" opacity="0.10" stroke="#73BE28" stroke-width="1" rx="6"/>
  <text x="230" y="125" text-anchor="middle" fill="#86EFAC" font-size="12" font-weight="700">Extensions 2.0 — the current framework</text>

  <rect x="440" y="100" width="450" height="40" fill="#FFB800" opacity="0.08" stroke="#FFB800" stroke-width="1" rx="6"/>
  <text x="665" y="125" text-anchor="middle" fill="#FCD34D" font-size="12" font-weight="700">Runs on an AG group (remote) or OneAgent (local)</text>

  <!-- Footer -->
  <line x1="40" y1="450" x2="890" y2="450" stroke="#334155" stroke-width="1"/>
  <text x="465" y="471" text-anchor="middle" fill="#64748B" font-size="11">Custom extensions — Extensions SDK · YAML schema · package and upload</text>
  <text x="465" y="488" text-anchor="middle" fill="#64748B" font-size="10">Deeper: AUTOM series for GitOps automation · CLOUD series for per-provider patterns</text>
</svg>
